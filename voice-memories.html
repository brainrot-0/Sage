<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MindEase - Voice Memories</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<style>

:root {
    --beige: #f5f1e8;
    --text: #2b2b2b;
    --accent: #b29b80;
    --light: #fff;
}

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body {
    font-family:"Poppins",sans-serif;
    background:var(--beige);
    color:var(--text);
}


/* Navbar */

nav {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 60px;
    background:rgba(255,255,255,0.4);
    backdrop-filter:blur(8px);
}

.logo {
    font-weight:600;
    font-size:22px;
    text-decoration:none;
    color:var(--text);
}

.logo:hover {
    color:var(--accent);
}

.nav-links a {
    margin-left:20px;
    text-decoration:none;
    color:var(--text);
    font-weight:500;
}

.nav-links a:hover {
    color:var(--accent);
}


/* Header */

header {
    text-align:center;
    padding:60px 20px;
}

header h1 {
    font-size:36px;
    margin-bottom:10px;
}

header p {
    font-size:18px;
    color:#555;
}


/* Main Container */

.container {
    max-width:900px;
    margin:0 auto;
    padding:20px;
}


/* Upload Section */

.memory-upload {
    display:flex;
    flex-direction:column;
    gap:15px;
    margin-bottom:30px;
}

.memory-upload input[type="file"],
.memory-upload input[type="text"] {
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
    font-family:"Poppins",sans-serif;
}

.memory-upload input[type="text"]:focus {
    outline:none;
    border-color:var(--accent);
}


/* Buttons */

.memory-upload button {
    background:var(--accent);
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:25px;
    cursor:pointer;
    font-weight:600;
    font-family:"Poppins",sans-serif;
}

.memory-upload button:hover {
    background:#9b886e;
}

.memory-upload button:disabled {
    opacity:0.5;
    cursor:not-allowed;
}


/* Waveform */

#waveform {
    width:100%;
    margin-top:20px;
    min-height:100px;
    background:#fff;
    border-radius:8px;
    overflow:hidden;
}


/* Controls */

.controls {
    display:flex;
    gap:10px;
    margin-top:10px;
    flex-wrap:wrap;
}

.controls button {
    background:var(--accent);
    color:white;
    border:none;
    padding:6px 12px;
    border-radius:15px;
    cursor:pointer;
    font-family:"Poppins",sans-serif;
}

.controls button:hover {
    background:#9b886e;
}


/* Selection Information */

.selection-info {
    font-size:14px;
    color:#555;
    min-height:20px;
}


/* Status Message */

.status-message {
    font-size:14px;
    color:#777;
    min-height:20px;
}


/* Memory List */

.memory-list {
    display:flex;
    flex-direction:column;
    gap:20px;
}


/* Memory Cards */

.memory-card {
    background:var(--light);
    padding:15px 20px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.08);
    display:flex;
    flex-direction:column;
    gap:10px;
}

.memory-card h3 {
    font-size:18px;
}

.memory-card audio {
    width:100%;
    outline:none;
}

.memory-card .info {
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:14px;
    color:#555;
    gap:10px;
    flex-wrap:wrap;
}

.memory-card button {
    background:#b29b80;
    color:white;
    border:none;
    padding:6px 12px;
    border-radius:15px;
    cursor:pointer;
    font-family:"Poppins",sans-serif;
}

.memory-card button:hover {
    background:#9b886e;
}

.memory-actions {
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.memory-actions button {
    margin:0;
}


/* Empty State */

.empty-message {
    text-align:center;
    color:#777;
    padding:30px;
    background:rgba(255,255,255,0.45);
    border-radius:15px;
}


/* Footer */

footer {
    text-align:center;
    padding:30px;
    color:#777;
    background:#efe8dc;
    margin-top:40px;
}


/* Responsive */

@media(max-width:768px){

    nav {
        padding:14px 20px;
    }

    .nav-links a {
        margin-left:10px;
        font-size:14px;
    }

    header h1 {
        font-size:30px;
    }

}

</style>

</head>


<body>


<!-- Navbar -->

<nav>

    <a href="index.html" class="logo">
        MindEase
    </a>

    <div class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="features.html">
            Features
        </a>

    </div>

</nav>


<!-- Header -->

<header>

    <h1>
        Voice Memories
    </h1>

    <p>
        Save and cherish the voice recordings of your loved ones.
        Trim, name, and replay anytime!
    </p>

</header>


<!-- Main -->

<div class="container">


    <!-- Upload -->

    <div class="memory-upload">

        <input
            type="file"
            id="audioFile"
            accept="audio/*"
        >


        <input
            type="text"
            id="memoryName"
            placeholder="Enter memory name"
            maxlength="60"
        >


        <div id="waveform"></div>


        <div
            class="selection-info"
            id="selectionInfo">
        </div>


        <div
            class="status-message"
            id="statusMessage">
        </div>


        <div class="controls">

            <button
                id="playPause"
                disabled>

                Play

            </button>


            <button
                id="resetSelection"
                disabled>

                Reset Selection

            </button>


            <button
                id="saveMemory"
                disabled>

                Save Trimmed Memory

            </button>

        </div>

    </div>


    <!-- Saved Memories -->

    <div
        class="memory-list"
        id="memoryList">

    </div>


</div>


<!-- Footer -->

<footer>

    © 2025 MindEase | Hackathon Project

</footer>



<script>

/* =====================================================
   VARIABLES
===================================================== */

let currentFile = null;

let currentAudio = null;

let currentAudioURL = null;

let audioContext = null;

let audioBuffer = null;

let isPlaying = false;

let playTimer = null;

let startTime = 0;

let endTime = 0;


/* =====================================================
   INDEXED DB
===================================================== */

const DB_NAME = "MindEaseVoiceMemories";

const DB_VERSION = 1;

const STORE_NAME = "memories";

let db;


/* Open database */

function openDatabase(){

    return new Promise((resolve,reject)=>{

        const request =
            indexedDB.open(
                DB_NAME,
                DB_VERSION
            );


        request.onupgradeneeded =
            function(event){

                const database =
                    event.target.result;


                if(
                    !database.objectStoreNames.contains(
                        STORE_NAME
                    )
                ){

                    database.createObjectStore(
                        STORE_NAME,
                        {
                            keyPath:"id",
                            autoIncrement:true
                        }
                    );

                }

            };


        request.onsuccess =
            function(event){

                db =
                    event.target.result;

                resolve(db);

            };


        request.onerror =
            function(){

                reject(
                    request.error
                );

            };

    });

}


/* Save */

function saveToDatabase(memory){

    return new Promise((resolve,reject)=>{

        const transaction =
            db.transaction(
                STORE_NAME,
                "readwrite"
            );

        const store =
            transaction.objectStore(
                STORE_NAME
            );

        const request =
            store.add(memory);


        request.onsuccess =
            function(){

                resolve(
                    request.result
                );

            };


        request.onerror =
            function(){

                reject(
                    request.error
                );

            };

    });

}


/* Get */

function getMemories(){

    return new Promise((resolve,reject)=>{

        const transaction =
            db.transaction(
                STORE_NAME,
                "readonly"
            );

        const store =
            transaction.objectStore(
                STORE_NAME
            );

        const request =
            store.getAll();


        request.onsuccess =
            function(){

                resolve(
                    request.result
                );

            };


        request.onerror =
            function(){

                reject(
                    request.error
                );

            };

    });

}


/* Delete */

function deleteFromDatabase(id){

    return new Promise((resolve,reject)=>{

        const transaction =
            db.transaction(
                STORE_NAME,
                "readwrite"
            );

        const store =
            transaction.objectStore(
                STORE_NAME
            );

        const request =
            store.delete(id);


        request.onsuccess =
            function(){

                resolve();

            };


        request.onerror =
            function(){

                reject(
                    request.error
                );

            };

    });

}


/* =====================================================
   AUDIO FILE
===================================================== */

document
.getElementById("audioFile")
.addEventListener(
    "change",
    async function(event){

        const file =
            event.target.files[0];


        if(!file){

            return;

        }


        if(
            !file.type ||
            !file.type.startsWith("audio/")
        ){

            showStatus(
                "Please select a valid audio file."
            );

            return;

        }


        stopPlayback();


        currentFile =
            file;


        if(currentAudioURL){

            URL.revokeObjectURL(
                currentAudioURL
            );

        }


        currentAudioURL =
            URL.createObjectURL(
                file
            );


        try{

            showStatus(
                "Loading audio..."
            );


            const arrayBuffer =
                await file.arrayBuffer();


            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();


            audioBuffer =
                await audioContext.decodeAudioData(
                    arrayBuffer
                );


            startTime = 0;

            endTime =
                audioBuffer.duration;


            drawWaveform();


            updateSelectionInfo();


            document.getElementById(
                "playPause"
            ).disabled = false;


            document.getElementById(
                "resetSelection"
            ).disabled = false;


            document.getElementById(
                "saveMemory"
            ).disabled = false;


            showStatus(
                "Audio loaded. Click and drag across the waveform to select the part you want to save."
            );


            document.getElementById(
                "memoryName"
            ).focus();

        }
        catch(error){

            console.error(error);

            showStatus(
                "This audio file could not be loaded. Try another file."
            );

        }

    }
);


/* =====================================================
   DRAW WAVEFORM
===================================================== */

function drawWaveform(){

    const container =
        document.getElementById(
            "waveform"
        );


    container.innerHTML = "";


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        container.clientWidth ||
        800;


    canvas.height =
        100;


    canvas.style.width =
        "100%";

    canvas.style.height =
        "100px";


    container.appendChild(
        canvas
    );


    const ctx =
        canvas.getContext(
            "2d"
        );


    const data =
        audioBuffer.getChannelData(
            0
        );


    const width =
        canvas.width;


    const height =
        canvas.height;


    const middle =
        height / 2;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    ctx.beginPath();


    const step =
        Math.ceil(
            data.length / width
        );


    for(
        let x = 0;
        x < width;
        x++
    ){

        const start =
            x * step;


        let min = 1;

        let max = -1;


        for(
            let i = 0;
            i < step &&
            start + i < data.length;
            i++
        ){

            const value =
                data[start + i];


            if(value < min){
                min = value;
            }


            if(value > max){
                max = value;
            }

        }


        ctx.moveTo(
            x,
            middle + min * middle * 0.8
        );


        ctx.lineTo(
            x,
            middle + max * middle * 0.8
        );

    }


    ctx.strokeStyle =
        "#b29b80";


    ctx.lineWidth =
        1;


    ctx.stroke();


    drawSelection();


    canvas.addEventListener(
        "mousedown",
        waveformMouseDown
    );


    canvas.addEventListener(
        "mousemove",
        waveformMouseMove
    );


    canvas.addEventListener(
        "mouseup",
        waveformMouseUp
    );


    canvas.addEventListener(
        "mouseleave",
        waveformMouseUp
    );


    canvas.addEventListener(
        "touchstart",
        waveformTouchStart,
        {
            passive:false
        }
    );


    canvas.addEventListener(
        "touchmove",
        waveformTouchMove,
        {
            passive:false
        }
    );


    canvas.addEventListener(
        "touchend",
        waveformTouchEnd,
        {
            passive:false
        }
    );

}


/* =====================================================
   WAVEFORM SELECTION
===================================================== */

let selecting = false;

let selectionStartPixel = 0;


/* Mouse down */

function waveformMouseDown(event){

    selecting = true;

    selectionStartPixel =
        getWaveformPosition(
            event
        );

}


/* Mouse move */

function waveformMouseMove(event){

    if(!selecting){

        return;

    }


    const currentPixel =
        getWaveformPosition(
            event
        );


    updateSelectionFromPixels(
        selectionStartPixel,
        currentPixel
    );

}


/* Mouse up */

function waveformMouseUp(){

    if(!selecting){

        return;

    }


    selecting = false;

}


/* Touch start */

function waveformTouchStart(event){

    event.preventDefault();


    selecting = true;


    selectionStartPixel =
        getWaveformPosition(
            event.touches[0]
        );

}


/* Touch move */

function waveformTouchMove(event){

    event.preventDefault();


    if(!selecting){

        return;

    }


    const currentPixel =
        getWaveformPosition(
            event.touches[0]
        );


    updateSelectionFromPixels(
        selectionStartPixel,
        currentPixel
    );

}


/* Touch end */

function waveformTouchEnd(event){

    event.preventDefault();

    selecting = false;

}


/* Get waveform position */

function getWaveformPosition(event){

    const canvas =
        document.querySelector(
            "#waveform canvas"
        );


    const rect =
        canvas.getBoundingClientRect();


    let x =
        event.clientX -
        rect.left;


    x =
        Math.max(
            0,
            Math.min(
                rect.width,
                x
            )
        );


    return x;

}


/* Update selection */

function updateSelectionFromPixels(
    first,
    second
){

    const canvas =
        document.querySelector(
            "#waveform canvas"
        );


    const width =
        canvas.getBoundingClientRect()
        .width;


    const left =
        Math.min(
            first,
            second
        );


    const right =
        Math.max(
            first,
            second
        );


    const duration =
        audioBuffer.duration;


    startTime =
        (left / width) *
        duration;


    endTime =
        (right / width) *
        duration;


    if(
        endTime - startTime < 0.2
    ){

        return;

    }


    drawSelection();

    updateSelectionInfo();

}


/* =====================================================
   DRAW SELECTED AREA
===================================================== */

function drawSelection(){

    const canvas =
        document.querySelector(
            "#waveform canvas"
        );


    if(!canvas || !audioBuffer){

        return;

    }


    const ctx =
        canvas.getContext(
            "2d"
        );


    const data =
        audioBuffer.getChannelData(
            0
        );


    const width =
        canvas.width;


    const height =
        canvas.height;


    const middle =
        height / 2;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    const step =
        Math.ceil(
            data.length / width
        );


    /*
       Draw selection background
    */

    const startX =
        (startTime /
        audioBuffer.duration) *
        width;


    const endX =
        (endTime /
        audioBuffer.duration) *
        width;


    ctx.fillStyle =
        "rgba(178,155,128,0.25)";


    ctx.fillRect(
        startX,
        0,
        endX - startX,
        height
    );


    /*
       Draw waveform
    */

    ctx.beginPath();


    for(
        let x = 0;
        x < width;
        x++
    ){

        const start =
            x * step;


        let min = 1;

        let max = -1;


        for(
            let i = 0;
            i < step &&
            start + i < data.length;
            i++
        ){

            const value =
                data[start + i];


            if(value < min){
                min = value;
            }


            if(value > max){
                max = value;
            }

        }


        ctx.moveTo(
            x,
            middle + min * middle * 0.8
        );


        ctx.lineTo(
            x,
            middle + max * middle * 0.8
        );

    }


    ctx.strokeStyle =
        "#b29b80";


    ctx.lineWidth =
        1;


    ctx.stroke();


    /*
       Selection borders
    */

    ctx.strokeStyle =
        "#9b886e";


    ctx.lineWidth =
        2;


    ctx.beginPath();


    ctx.moveTo(
        startX,
        0
    );


    ctx.lineTo(
        startX,
        height
    );


    ctx.moveTo(
        endX,
        0
    );


    ctx.lineTo(
        endX,
        height
    );


    ctx.stroke();

}


/* =====================================================
   SELECTION INFORMATION
===================================================== */

function updateSelectionInfo(){

    if(!audioBuffer){

        return;

    }


    document.getElementById(
        "selectionInfo"
    ).textContent =

        "Selected: " +

        formatTime(startTime) +

        " – " +

        formatTime(endTime) +

        " | Duration: " +

        formatTime(
            endTime - startTime
        );

}


/* Format time */

function formatTime(seconds){

    if(
        !Number.isFinite(seconds)
    ){

        return "0:00";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        Math.floor(
            seconds % 60
        );


    return (
        minutes +
        ":" +
        String(secs)
        .padStart(
            2,
            "0"
        )
    );

}


/* =====================================================
   PLAY SELECTED AUDIO
===================================================== */

document
.getElementById("playPause")
.addEventListener(
    "click",
    function(){

        if(!currentFile){

            return;

        }


        if(isPlaying){

            stopPlayback();

            return;

        }


        playSelectedAudio();

    }
);


/* Play selected */

function playSelectedAudio(){

    stopPlayback();


    currentAudio =
        new Audio(
            currentAudioURL
        );


    currentAudio.currentTime =
        startTime;


    isPlaying = true;


    document.getElementById(
        "playPause"
    ).textContent =
        "Pause";


    currentAudio.play()
    .catch(
        function(error){

            console.error(error);

            showStatus(
                "The browser blocked audio playback. Click Play again."
            );

            stopPlayback();

        }
    );


    playTimer =
        setInterval(
            function(){

                if(
                    currentAudio &&
                    currentAudio.currentTime >=
                    endTime
                ){

                    stopPlayback();

                }

            },
            100
        );

}


/* Stop playback */

function stopPlayback(){

    if(currentAudio){

        currentAudio.pause();

        currentAudio.currentTime =
            0;

        currentAudio = null;

    }


    clearInterval(
        playTimer
    );


    playTimer =
        null;


    isPlaying =
        false;


    const button =
        document.getElementById(
            "playPause"
        );


    button.textContent =
        "Play";

}


/* =====================================================
   RESET SELECTION
===================================================== */

document
.getElementById("resetSelection")
.addEventListener(
    "click",
    function(){

        if(!audioBuffer){

            return;

        }


        stopPlayback();


        startTime = 0;

        endTime =
            audioBuffer.duration;


        drawSelection();

        updateSelectionInfo();


        showStatus(
            "Selection reset to the full recording."
        );

    }
);


/* =====================================================
   SAVE TRIMMED MEMORY
===================================================== */

document
.getElementById("saveMemory")
.addEventListener(
    "click",
    async function(){

        const nameInput =
            document.getElementById(
                "memoryName"
            );


        const name =
            nameInput.value.trim();


        if(!currentFile || !audioBuffer){

            showStatus(
                "Please upload an audio recording first."
            );

            return;

        }


        if(!name){

            showStatus(
                "Please enter a name for your voice memory."
            );

            nameInput.focus();

            return;

        }


        if(
            endTime <= startTime
        ){

            showStatus(
                "Please select a valid portion of the recording."
            );

            return;

        }


        try{

            showStatus(
                "Creating your voice memory..."
            );


            const trimmedBlob =
                await createWavBlob(
                    audioBuffer,
                    startTime,
                    endTime
                );


            await saveToDatabase({

                name:name,

                audio:trimmedBlob,

                date:
                    new Date()
                    .toLocaleString(),

                duration:
                    endTime -
                    startTime

            });


            nameInput.value =
                "";


            showStatus(
                "Voice memory saved successfully."
            );


            await displayMemories();

        }
        catch(error){

            console.error(error);

            showStatus(
                "Could not save the voice memory. Please try again."
            );

        }

    }
);


/* =====================================================
   CREATE WAV
===================================================== */

async function createWavBlob(
    sourceBuffer,
    start,
    end
){

    const sampleRate =
        sourceBuffer.sampleRate;


    const startSample =
        Math.floor(
            start *
            sampleRate
        );


    const endSample =
        Math.floor(
            end *
            sampleRate
        );


    const frameCount =
        endSample -
        startSample;


    const channels =
        sourceBuffer.numberOfChannels;


    const wavBuffer =
        new ArrayBuffer(
            44 +
            frameCount *
            channels *
            2
        );


    const view =
        new DataView(
            wavBuffer
        );


    writeString(
        view,
        0,
        "RIFF"
    );


    view.setUint32(
        4,
        36 +
        frameCount *
        channels *
        2,
        true
    );


    writeString(
        view,
        8,
        "WAVE"
    );


    writeString(
        view,
        12,
        "fmt "
    );


    view.setUint32(
        16,
        16,
        true
    );


    view.setUint16(
        20,
        1,
        true
    );


    view.setUint16(
        22,
        channels,
        true
    );


    view.setUint32(
        24,
        sampleRate,
        true
    );


    view.setUint32(
        28,
        sampleRate *
        channels *
        2,
        true
    );


    view.setUint16(
        32,
        channels * 2,
        true
    );


    view.setUint16(
        34,
        16,
        true
    );


    writeString(
        view,
        36,
        "data"
    );


    view.setUint32(
        40,
        frameCount *
        channels *
        2,
        true
    );


    let offset = 44;


    for(
        let i = startSample;
        i < endSample;
        i++
    ){

        for(
            let channel = 0;
            channel < channels;
            channel++
        ){

            let sample =
                sourceBuffer
                .getChannelData(
                    channel
                )[i];


            sample =
                Math.max(
                    -1,
                    Math.min(
                        1,
                        sample
                    )
                );


            const value =
                sample < 0
                ? sample * 32768
                : sample * 32767;


            view.setInt16(
                offset,
                value,
                true
            );


            offset += 2;

        }

    }


    return new Blob(
        [wavBuffer],
        {
            type:"audio/wav"
        }
    );

}


/* Write string */

function writeString(
    view,
    offset,
    string
){

    for(
        let i = 0;
        i < string.length;
        i++
    ){

        view.setUint8(
            offset + i,
            string.charCodeAt(i)
        );

    }

}


/* =====================================================
   DISPLAY MEMORIES
===================================================== */

async function displayMemories(){

    const memoryList =
        document.getElementById(
            "memoryList"
        );


    const memories =
        await getMemories();


    memoryList.innerHTML =
        "";


    if(memories.length === 0){

        memoryList.innerHTML = `

            <div class="empty-message">

                No voice memories saved yet.
                Upload a recording above to create your first memory.

            </div>

        `;

        return;

    }


    memories
    .sort(
        (a,b) =>
            b.id - a.id
    )
    .forEach(
        function(memory){

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "memory-card";


            const audio =
                document.createElement(
                    "audio"
                );


            audio.controls =
                true;


            const audioURL =
                URL.createObjectURL(
                    memory.audio
                );


            audio.src =
                audioURL;


            const title =
                document.createElement(
                    "h3"
                );


            title.textContent =
                memory.name;


            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "info";


            const date =
                document.createElement(
                    "span"
                );


            date.textContent =
                memory.date;


            const duration =
                document.createElement(
                    "span"
                );


            duration.textContent =
                formatTime(
                    memory.duration
                );


            info.appendChild(
                date
            );


            info.appendChild(
                duration
            );


            const actions =
                document.createElement(
                    "div"
                );


            actions.className =
                "memory-actions";


            const renameButton =
                document.createElement(
                    "button"
                );


            renameButton.textContent =
                "Rename";


            renameButton.onclick =
                function(){

                    renameMemory(
                        memory.id
                    );

                };


            const deleteButton =
                document.createElement(
                    "button"
                );


            deleteButton.textContent =
                "Delete";


            deleteButton.onclick =
                function(){

                    deleteMemory(
                        memory.id
                    );

                };


            actions.appendChild(
                renameButton
            );


            actions.appendChild(
                deleteButton
            );


            card.appendChild(
                title
            );


            card.appendChild(
                audio
            );


            card.appendChild(
                info
            );


            card.appendChild(
                actions
            );


            audio.addEventListener(
                "play",
                function(){

                    stopOtherAudio(
                        audio
                    );

                }
            );


            memoryList.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   STOP OTHER SAVED AUDIO
===================================================== */

function stopOtherAudio(
    current
){

    document
    .querySelectorAll(
        ".memory-card audio"
    )
    .forEach(
        function(audio){

            if(
                audio !== current
            ){

                audio.pause();

            }

        }
    );

}


/* =====================================================
   RENAME MEMORY
===================================================== */

async function renameMemory(id){

    const memories =
        await getMemories();


    const memory =
        memories.find(
            item =>
                item.id === id
        );


    if(!memory){

        return;

    }


    const newName =
        prompt(
            "Enter a new name:",
            memory.name
        );


    if(
        !newName ||
        !newName.trim()
    ){

        return;

    }


    memory.name =
        newName.trim();


    const transaction =
        db.transaction(
            STORE_NAME,
            "readwrite"
        );


    const store =
        transaction.objectStore(
            STORE_NAME
        );


    store.put(
        memory
    );


    transaction.oncomplete =
        function(){

            displayMemories();

        };

}


/* =====================================================
   DELETE MEMORY
===================================================== */

async function deleteMemory(id){

    const memories =
        await getMemories();


    const memory =
        memories.find(
            item =>
                item.id === id
        );


    if(!memory){

        return;

    }


    const confirmed =
        confirm(
            'Delete "' +
            memory.name +
            '"?'
        );


    if(!confirmed){

        return;

    }


    try{

        await deleteFromDatabase(
            id
        );


        await displayMemories();


        showStatus(
            "Voice memory deleted."
        );

    }
    catch(error){

        console.error(error);

        showStatus(
            "Could not delete the memory."
        );

    }

}


/* =====================================================
   STATUS
===================================================== */

function showStatus(message){

    document.getElementById(
        "statusMessage"
    ).textContent =
        message;

}


/* =====================================================
   INITIALIZATION
===================================================== */

async function initialize(){

    try{

        await openDatabase();

        await displayMemories();

    }
    catch(error){

        console.error(error);

        showStatus(
            "Voice memory storage could not be initialized."
        );

    }

}


initialize();


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
    "beforeunload",
    function(){

        stopPlayback();


        if(currentAudioURL){

            URL.revokeObjectURL(
                currentAudioURL
            );

        }


        if(audioContext){

            audioContext.close();

        }

    }
);
