<script>

/* =====================================================
   INDEXED DB
===================================================== */

const DB_NAME = "MindEaseVoiceMemories";

const DB_VERSION = 1;

const STORE_NAME = "memories";

let db;


/* Open database */

function openDatabase(){

    return new Promise((resolve,reject)=>{

        const request =
            indexedDB.open(
                DB_NAME,
                DB_VERSION
            );


        request.onupgradeneeded =
            function(event){

                const database =
                    event.target.result;


                if(
                    !database.objectStoreNames.contains(
                        STORE_NAME
                    )
                ){

                    database.createObjectStore(
                        STORE_NAME,
                        {
                            keyPath:"id",
                            autoIncrement:true
                        }
                    );

                }

            };


        request.onsuccess =
            function(event){

                db =
                    event.target.result;

                resolve(db);

            };


        request.onerror =
            function(){

                reject(
                    request.error
                );

            };

    });

}


/* =====================================================
   DATABASE FUNCTIONS
===================================================== */


/* Save memory */

function saveToDatabase(memory){

    return new Promise((resolve,reject)=>{

        const transaction =
            db.transaction(
                STORE_NAME,
                "readwrite"
            );

        const store =
            transaction.objectStore(
                STORE_NAME
            );


        const request =
            store.add(memory);


        request.onsuccess =
            function(){

                resolve(
                    request.result
                );

            };


        request.onerror =
            function(){

                reject(
                    request.error
                );

            };

    });

}


/* Get all memories */

function getMemories(){

    return new Promise((resolve,reject)=>{

        const transaction =
            db.transaction(
                STORE_NAME,
                "readonly"
            );

        const store =
            transaction.objectStore(
                STORE_NAME
            );


        const request =
            store.getAll();


        request.onsuccess =
            function(){

                resolve(
                    request.result
                );

            };


        request.onerror =
            function(){

                reject(
                    request.error
                );

            };

    });

}


/* Delete memory */

function deleteFromDatabase(id){

    return new Promise((resolve,reject)=>{

        const transaction =
            db.transaction(
                STORE_NAME,
                "readwrite"
            );

        const store =
            transaction.objectStore(
                STORE_NAME
            );


        const request =
            store.delete(id);


        request.onsuccess =
            function(){

                resolve();

            };


        request.onerror =
            function(){

                reject(
                    request.error
                );

            };

    });

}


/* =====================================================
   WAVESURFER
===================================================== */

let wavesurfer = null;

let regionsPlugin = null;

let selectedRegion = null;

let currentAudioURL = null;


/* Create WaveSurfer */

function initializeWaveSurfer(){

    regionsPlugin =
        WaveSurfer.Regions.create();


    wavesurfer =
        WaveSurfer.create({

            container:"#waveform",

            waveColor:"#b29b80",

            progressColor:"#9b886e",

            cursorColor:"#555",

            height:100,

            responsive:true,

            normalize:true,

            plugins:[
                regionsPlugin
            ]

        });


    wavesurfer.on(
        "ready",
        function(){

            const duration =
                wavesurfer.getDuration();


            selectedRegion =
                regionsPlugin.addRegion({

                    start:0,

                    end:duration,

                    color:"rgba(178,155,128,0.3)",

                    drag:true,

                    resize:true

                });


            updateSelectionInfo();

            document.getElementById(
                "playPause"
            ).disabled = false;


            document.getElementById(
                "resetSelection"
            ).disabled = false;


            document.getElementById(
                "saveMemory"
            ).disabled = false;


            showStatus(
                "Audio loaded. Drag the edges of the highlighted area to trim your memory."
            );

        });


    wavesurfer.on(
        "play",
        function(){

            document.getElementById(
                "playPause"
            ).textContent =
                "Pause";

        });


    wavesurfer.on(
        "pause",
        function(){

            document.getElementById(
                "playPause"
            ).textContent =
                "Play";

        });


    wavesurfer.on(
        "finish",
        function(){

            document.getElementById(
                "playPause"
            ).textContent =
                "Play";

        });


    regionsPlugin.on(
        "region-updated",
        function(region){

            selectedRegion =
                region;

            updateSelectionInfo();

        });

}


/* =====================================================
   FILE UPLOAD
===================================================== */

document
.getElementById("audioFile")
.addEventListener(
    "change",
    function(event){

        const file =
            event.target.files[0];


        if(!file){

            return;

        }


        if(!file.type.startsWith("audio/")){

            showStatus(
                "Please select a valid audio file."
            );

            return;

        }


        if(currentAudioURL){

            URL.revokeObjectURL(
                currentAudioURL
            );

        }


        currentAudioURL =
            URL.createObjectURL(
                file
            );


        resetWaveform();


        wavesurfer.load(
            currentAudioURL
        );


        document.getElementById(
            "memoryName"
        ).focus();

    }
);


/* =====================================================
   PLAY / PAUSE
===================================================== */

document
.getElementById("playPause")
.addEventListener(
    "click",
    function(){

        if(!wavesurfer){

            return;

        }


        if(
            selectedRegion &&
            selectedRegion.start !== undefined
        ){

            selectedRegion.play();

        }else{

            wavesurfer.playPause();

        }

    }
);


/* =====================================================
   RESET SELECTION
===================================================== */

document
.getElementById("resetSelection")
.addEventListener(
    "click",
    function(){

        if(!wavesurfer){

            return;

        }


        regionsPlugin.clear();


        selectedRegion =
            regionsPlugin.addRegion({

                start:0,

                end:wavesurfer.getDuration(),

                color:"rgba(178,155,128,0.3)",

                drag:true,

                resize:true

            });


        updateSelectionInfo();


        showStatus(
            "Selection reset to the full recording."
        );

    }
);


/* =====================================================
   SELECTION INFORMATION
===================================================== */

function updateSelectionInfo(){

    const info =
        document.getElementById(
            "selectionInfo"
        );


    if(!selectedRegion){

        info.textContent =
            "";

        return;

    }


    const start =
        formatTime(
            selectedRegion.start
        );


    const end =
        formatTime(
            selectedRegion.end
        );


    const duration =
        formatTime(
            selectedRegion.end -
            selectedRegion.start
        );


    info.textContent =
        "Selected: " +
        start +
        " – " +
        end +
        " | Duration: " +
        duration;

}


/* Format time */

function formatTime(seconds){

    if(!Number.isFinite(seconds)){

        return "0:00";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        Math.floor(
            seconds % 60
        );


    return (
        minutes +
        ":" +
        String(secs).padStart(
            2,
            "0"
        )
    );

}


/* =====================================================
   SAVE MEMORY
===================================================== */

document
.getElementById("saveMemory")
.addEventListener(
    "click",
    async function(){

        const nameInput =
            document.getElementById(
                "memoryName"
            );


        const name =
            nameInput.value.trim();


        if(!name){

            showStatus(
                "Please enter a name for your voice memory."
            );

            nameInput.focus();

            return;

        }


        if(!selectedRegion){

            showStatus(
                "Please select a portion of the recording first."
            );

            return;

        }


        if(!wavesurfer){

            showStatus(
                "Please upload an audio recording first."
            );

            return;

        }


        try{

            showStatus(
                "Preparing your voice memory..."
            );


            const blob =
                await createTrimmedAudio(
                    selectedRegion.start,
                    selectedRegion.end
                );


            await saveToDatabase({

                name:name,

                audio:blob,

                date:new Date().toLocaleString(),

                duration:
                    selectedRegion.end -
                    selectedRegion.start

            });


            showStatus(
                "Voice memory saved successfully."
            );


            nameInput.value = "";


            await displayMemories();


        }
        catch(error){

            console.error(error);

            showStatus(
                "Could not save the recording. Please try again."
            );

        }

    }
);


/* =====================================================
   CREATE TRIMMED AUDIO
===================================================== */

async function createTrimmedAudio(
    startTime,
    endTime
){

    const audioBuffer =
        await getAudioBuffer();


    const sampleRate =
        audioBuffer.sampleRate;


    const start =
        Math.floor(
            startTime *
            sampleRate
        );


    const end =
        Math.floor(
            endTime *
            sampleRate
        );


    const frameCount =
        end - start;


    const trimmedBuffer =
        new AudioContext()
        .createBuffer(
            audioBuffer.numberOfChannels,
            frameCount,
            sampleRate
        );


    for(
        let channel = 0;
        channel < audioBuffer.numberOfChannels;
        channel++
    ){

        const data =
            audioBuffer
            .getChannelData(
                channel
            );


        const trimmedData =
            trimmedBuffer
            .getChannelData(
                channel
            );


        trimmedData.set(
            data.slice(
                start,
                end
            )
        );

    }


    return audioBufferToWav(
        trimmedBuffer
    );

}


/* =====================================================
   GET ORIGINAL AUDIO BUFFER
===================================================== */

async function getAudioBuffer(){

    const response =
        await fetch(
            currentAudioURL
        );


    const arrayBuffer =
        await response.arrayBuffer();


    const audioContext =
        new AudioContext();


    const audioBuffer =
        await audioContext.decodeAudioData(
            arrayBuffer
        );


    await audioContext.close();


    return audioBuffer;

}


/* =====================================================
   CONVERT AUDIO BUFFER TO WAV
===================================================== */

function audioBufferToWav(buffer){

    const numberOfChannels =
        buffer.numberOfChannels;


    const sampleRate =
        buffer.sampleRate;


    const format = 1;


    const bitDepth = 16;


    const channelData = [];


    for(
        let channel = 0;
        channel < numberOfChannels;
        channel++
    ){

        channelData.push(
            buffer.getChannelData(
                channel
            )
        );

    }


    const dataLength =
        channelData[0].length *
        numberOfChannels *
        2;


    const arrayBuffer =
        new ArrayBuffer(
            44 + dataLength
        );


    const view =
        new DataView(
            arrayBuffer
        );


    writeString(
        view,
        0,
        "RIFF"
    );


    view.setUint32(
        4,
        36 + dataLength,
        true
    );


    writeString(
        view,
        8,
        "WAVE"
    );


    writeString(
        view,
        12,
        "fmt "
    );


    view.setUint32(
        16,
        16,
        true
    );


    view.setUint16(
        20,
        format,
        true
    );


    view.setUint16(
        22,
        numberOfChannels,
        true
    );


    view.setUint32(
        24,
        sampleRate,
        true
    );


    view.setUint32(
        28,
        sampleRate *
        numberOfChannels *
        2,
        true
    );


    view.setUint16(
        32,
        numberOfChannels * 2,
        true
    );


    view.setUint16(
        34,
        bitDepth,
        true
    );


    writeString(
        view,
        36,
        "data"
    );


    view.setUint32(
        40,
        dataLength,
        true
    );


    let offset = 44;


    for(
        let i = 0;
        i < channelData[0].length;
        i++
    ){

        for(
            let channel = 0;
            channel < numberOfChannels;
            channel++
        ){

            let sample =
                channelData[channel][i];


            sample =
                Math.max(
                    -1,
                    Math.min(
                        1,
                        sample
                    )
                );


            sample =
                sample < 0
                ? sample * 0x8000
                : sample * 0x7FFF;


            view.setInt16(
                offset,
                sample,
                true
            );


            offset += 2;

        }

    }


    return new Blob(
        [arrayBuffer],
        {
            type:"audio/wav"
        }
    );

}


/* Write WAV strings */

function writeString(
    view,
    offset,
    string
){

    for(
        let i = 0;
        i < string.length;
        i++
    ){

        view.setUint8(
            offset + i,
            string.charCodeAt(i)
        );

    }

}


/* =====================================================
   DISPLAY SAVED MEMORIES
===================================================== */

async function displayMemories(){

    const memoryList =
        document.getElementById(
            "memoryList"
        );


    const memories =
        await getMemories();


    memoryList.innerHTML = "";


    if(memories.length === 0){

        memoryList.innerHTML = `

            <div class="empty-message">

                No voice memories saved yet.
                Upload a recording above to create your first memory.

            </div>

        `;

        return;

    }


    memories
    .sort(
        (a,b) =>
            b.id - a.id
    )
    .forEach(
        function(memory){

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "memory-card";


            const audioURL =
                URL.createObjectURL(
                    memory.audio
                );


            card.innerHTML = `

                <h3>
                    ${escapeHTML(memory.name)}
                </h3>

                <audio
                    controls
                    src="${audioURL}">
                </audio>

                <div class="info">

                    <span>
                        ${escapeHTML(memory.date)}
                    </span>

                    <span>
                        ${formatTime(memory.duration)}
                    </span>

                </div>

                <div class="memory-actions">

                    <button
                        onclick="renameMemory(${memory.id})">

                        Rename

                    </button>

                    <button
                        onclick="deleteMemory(${memory.id})">

                        Delete

                    </button>

                </div>

            `;


            const audio =
                card.querySelector(
                    "audio"
                );


            audio.addEventListener(
                "play",
                function(){

                    stopOtherAudio(
                        audio
                    );

                }
            );


            memoryList.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   STOP OTHER MEMORY AUDIO
===================================================== */

function stopOtherAudio(currentAudio){

    document
    .querySelectorAll(
        ".memory-card audio"
    )
    .forEach(
        function(audio){

            if(
                audio !== currentAudio
            ){

                audio.pause();

            }

        }
    );

}


/* =====================================================
   RENAME MEMORY
===================================================== */

async function renameMemory(id){

    const memories =
        await getMemories();


    const memory =
        memories.find(
            item =>
                item.id === id
        );


    if(!memory){

        return;

    }


    const newName =
        prompt(
            "Enter a new name:",
            memory.name
        );


    if(
        !newName ||
        !newName.trim()
    ){

        return;

    }


    const transaction =
        db.transaction(
            STORE_NAME,
            "readwrite"
        );


    const store =
        transaction.objectStore(
            STORE_NAME
        );


    memory.name =
        newName.trim();


    store.put(
        memory
    );


    transaction.oncomplete =
        function(){

            displayMemories();

        };

}


/* =====================================================
   DELETE MEMORY
===================================================== */

async function deleteMemory(id){

    const memories =
        await getMemories();


    const memory =
        memories.find(
            item =>
                item.id === id
        );


    if(!memory){

        return;

    }


    const confirmed =
        confirm(
            "Delete \"" +
            memory.name +
            "\"?"
        );


    if(!confirmed){

        return;

    }


    try{

        await deleteFromDatabase(
            id
        );


        await displayMemories();


        showStatus(
            "Voice memory deleted."
        );

    }
    catch(error){

        console.error(error);

        showStatus(
            "Could not delete the memory."
        );

    }

}


/* =====================================================
   RESET WAVEFORM
===================================================== */

function resetWaveform(){

    if(!wavesurfer){

        return;

    }


    regionsPlugin.clear();


    selectedRegion =
        null;


    document.getElementById(
        "selectionInfo"
    ).textContent = "";


    document.getElementById(
        "playPause"
    ).disabled = true;


    document.getElementById(
        "resetSelection"
    ).disabled = true;


    document.getElementById(
        "saveMemory"
    ).disabled = true;

}


/* =====================================================
   STATUS MESSAGE
===================================================== */

function showStatus(message){

    document.getElementById(
        "statusMessage"
    ).textContent =
        message;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value;


    return div.innerHTML;

}


/* =====================================================
   INITIALIZATION
===================================================== */

async function initialize(){

    try{

        await openDatabase();

        initializeWaveSurfer();

        await displayMemories();

    }
    catch(error){

        console.error(error);

        showStatus(
            "Voice memory storage could not be initialized."
        );

    }

}


initialize();
