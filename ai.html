<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MindEase AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',sans-serif;background:#e8ded2;color:#4d443d;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.background-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#e8ded2,#d8c9ba,#eee5dc);z-index:-1}
.layout{width:95%;max-width:1400px;height:90vh;display:flex;background:rgba(255,255,255,.45);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.6);border-radius:25px;box-shadow:0 20px 60px rgba(75,60,45,.15);overflow:hidden}
.sidebar{width:280px;padding:25px 18px;display:flex;flex-direction:column;background:rgba(255,255,255,.28);border-right:1px solid rgba(255,255,255,.5)}
.logo{text-align:center;font-size:24px;font-weight:600;color:#62564c;margin-bottom:25px}
.logo i{margin-right:8px}
.sidebar-btn{width:100%;border:none;border-radius:12px;padding:12px 15px;margin-bottom:10px;background:rgba(255,255,255,.55);color:#5e5349;font-family:'Poppins',sans-serif;font-size:14px;cursor:pointer;transition:.25s;text-align:left}
.sidebar-btn:hover{background:rgba(255,255,255,.85);transform:translateY(-1px)}
.sidebar-btn i{width:22px}
.chat-history-list{flex:1;overflow-y:auto;margin-top:12px;padding-right:4px}
.chat-history-list::-webkit-scrollbar,.chat-box::-webkit-scrollbar{width:5px}
.chat-history-list::-webkit-scrollbar-thumb,.chat-box::-webkit-scrollbar-thumb{background:rgba(100,85,70,.25);border-radius:10px}
.history-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#8a7b6d;margin:15px 8px 10px}
.chat-thread{padding:11px 12px;border-radius:10px;margin-bottom:6px;font-size:13px;color:#62574e;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.2s}
.chat-thread:hover{background:rgba(255,255,255,.55)}
.chat-thread.active{background:rgba(255,255,255,.75);font-weight:500}
.chat-area{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-header{height:75px;padding:0 30px;display:flex;align-items:center;border-bottom:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.2)}
.chat-header h1{font-size:20px;font-weight:600;color:#554a42}
.chat-header p{font-size:12px;color:#897b6e;margin-top:2px}
.chat-box{flex:1;overflow-y:auto;padding:30px 8%;scroll-behavior:smooth}
.chat-message{max-width:75%;padding:13px 17px;margin-bottom:15px;border-radius:18px;line-height:1.6;font-size:14px;animation:fadeIn .25s ease;white-space:pre-wrap;word-wrap:break-word}
.chat-message.user{margin-left:auto;background:#b8a99a;color:#fff;border-bottom-right-radius:5px}
.chat-message.bot{margin-right:auto;background:rgba(255,255,255,.72);color:#554a42;border-bottom-left-radius:5px}
.chat-message.crisis{background:rgba(255,244,238,.95);border:1px solid rgba(180,100,70,.3);color:#5d4037}
.feature-container{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.feature-btn{border:none;background:#d8c8b8;color:#5a4d42;padding:8px 11px;border-radius:10px;font-family:'Poppins',sans-serif;font-size:12px;cursor:pointer;transition:.2s}
.feature-btn:hover{background:#cbb8a6;transform:translateY(-1px)}
.typing{display:flex;gap:5px;align-items:center;width:max-content;padding:13px 16px;background:rgba(255,255,255,.72);border-radius:18px;border-bottom-left-radius:5px;margin-bottom:15px}
.typing span{width:6px;height:6px;background:#8b7a6a;border-radius:50%;animation:typing 1.2s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes typing{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.chat-form{padding:18px 6%;display:flex;align-items:center;gap:10px;border-top:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.18)}
.chat-form input[type="text"]{flex:1;border:none;outline:none;background:rgba(255,255,255,.72);padding:13px 17px;border-radius:14px;font-family:'Poppins',sans-serif;color:#51463d;font-size:14px}
.chat-form input[type="text"]::placeholder{color:#9a8b7d}
.chat-form button{border:none;width:46px;height:46px;border-radius:13px;background:#9e8d7c;color:#fff;cursor:pointer;transition:.2s}
.chat-form button:hover{background:#887665;transform:translateY(-1px)}
.chat-form button:disabled{opacity:.5;cursor:not-allowed;transform:none}
.file-upload{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.65);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#76685b;transition:.2s}
.file-upload:hover{background:rgba(255,255,255,.9)}
.file-upload input{display:none}
.bot-prompt{font-size:12px;color:#918276;text-align:center;margin-top:5px}
@media(max-width:768px){
body{overflow:auto}
.layout{width:100%;height:100vh;border-radius:0}
.sidebar{display:none}
.chat-box{padding:25px 5%}
.chat-message{max-width:88%}
.chat-form{padding:15px 4%}
}
</style>
</head>
<body>
<div class="background-overlay"></div>

<div class="layout">

<aside class="sidebar">

<div class="logo">
<i class="fas fa-brain"></i>MindEase AI
</div>

<button class="sidebar-btn" id="newChatBtn">
<i class="fas fa-plus"></i> New Chat
</button>

<button class="sidebar-btn" id="exportBtn">
<i class="fas fa-download"></i> Export Chat
</button>

<button class="sidebar-btn" id="clearBtn">
<i class="fas fa-trash"></i> Delete All History
</button>

<div class="history-title">Recent Chats</div>

<div class="chat-history-list" id="chatHistory"></div>

</aside>

<main class="chat-area">

<header class="chat-header">
<div>
<h1>MindEase Assistant</h1>
<p>Your friendly space to talk, reflect and feel heard.</p>
</div>
</header>

<div class="chat-box" id="chatBox"></div>

<div class="bot-prompt">
MindEase AI is here to listen.
</div>

<form class="chat-form" id="chatForm">

<label class="file-upload" title="Share an image">
<i class="fas fa-image"></i>
<input type="file" id="fileInput" accept="image/*">
</label>

<input
type="text"
id="userInput"
placeholder="Talk to me..."
autocomplete="off"
>

<button type="submit" id="sendButton" title="Send">
<i class="fas fa-paper-plane"></i>
</button>

</form>

</main>
</div>

<script>
const chatBox=document.getElementById("chatBox");
const chatForm=document.getElementById("chatForm");
const userInput=document.getElementById("userInput");
const sendButton=document.getElementById("sendButton");
const newChatBtn=document.getElementById("newChatBtn");
const exportBtn=document.getElementById("exportBtn");
const clearBtn=document.getElementById("clearBtn");
const fileInput=document.getElementById("fileInput");
const chatHistory=document.getElementById("chatHistory");

const STORAGE_KEY="mindease_chat_sessions";

let currentSessionId=null;
let localMessages=[];
let chatSessions=[];

function createId(){
return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}

function createContext(){
return{
userName:"",
lastMood:"neutral",
moodHistory:[],
lastTopic:"",
lastIntent:"",
lastSuggestion:"",
conversationStage:"opening",
recentUserMessages:[],
recentBotMessages:[],
messageCount:0,
crisisContext:false,
sessionStart:new Date().toISOString()
};
}

let conversationContext=createContext();

function saveSessions(){
localStorage.setItem(
STORAGE_KEY,
JSON.stringify(chatSessions)
);
}

function loadSessions(){
try{
const saved=localStorage.getItem(STORAGE_KEY);
chatSessions=saved?JSON.parse(saved):[];
if(!Array.isArray(chatSessions))chatSessions=[];
}catch{
chatSessions=[];
}
}

function getCurrentSession(){
return chatSessions.find(
session=>session.id===currentSessionId
);
}

function updateCurrentSession(){

const session=getCurrentSession();

if(!session)return;

session.messages=localMessages;
session.context=conversationContext;
session.updatedAt=new Date().toISOString();

const firstUser=localMessages.find(
message=>message.sender==="user"
);

if(firstUser){
session.title=
firstUser.text.length>35
?firstUser.text.slice(0,35)+"..."
:firstUser.text;
}

saveSessions();
renderHistory();
}

function createSession(){

currentSessionId=createId();
localMessages=[];
conversationContext=createContext();

const session={
id:currentSessionId,
title:"New conversation",
messages:[],
context:conversationContext,
createdAt:new Date().toISOString(),
updatedAt:new Date().toISOString()
};

chatSessions.unshift(session);

saveSessions();

chatBox.innerHTML="";

displayMessage(
"Hello! I’m glad you’re here. You can talk to me about what's on your mind, ask a question, or simply have a conversation. How are you feeling today?",
"bot"
);
}

function loadSession(id){

const session=chatSessions.find(
item=>item.id===id
);

if(!session)return;

currentSessionId=id;

localMessages=
Array.isArray(session.messages)
?session.messages
:[];

conversationContext={
...createContext(),
...(session.context||{})
};

chatBox.innerHTML="";

localMessages.forEach(message=>{
renderMessage(
message.text,
message.sender,
message.features||[],
message.type||""
);
});

renderHistory();

chatBox.scrollTop=chatBox.scrollHeight;
}

function renderHistory(){

chatHistory.innerHTML="";

const sessions=chatSessions.filter(
session=>
session.messages &&
session.messages.some(
message=>message.sender==="user"
)
);

if(!sessions.length){

const empty=document.createElement("div");

empty.style.cssText=
"font-size:12px;color:#9a8b7d;padding:10px 8px";

empty.textContent=
"Your conversations will appear here.";

chatHistory.appendChild(empty);

return;
}

sessions.slice(0,20).forEach(session=>{

const item=document.createElement("div");

item.className=
"chat-thread"+
(session.id===currentSessionId?" active":"");

item.textContent=
session.title||"Conversation";

item.title=
session.title||"Conversation";

item.addEventListener(
"click",
()=>loadSession(session.id)
);

chatHistory.appendChild(item);
});
}

function renderMessage(
message,
sender="bot",
features=[],
type=""
){

const div=document.createElement("div");

div.className=
"chat-message "+
sender+
(type==="crisis"?" crisis":"");

div.textContent=message;

if(features.length){

const container=
document.createElement("div");

container.className=
"feature-container";

features.forEach(feature=>{

const button=
document.createElement("button");

button.type="button";
button.className="feature-btn";

const featureData=
getFeatureData(feature);

button.textContent=
featureData.label;

button.addEventListener(
"click",
()=>{
conversationContext.lastSuggestion=
feature;
openFeature(feature);
}
);

container.appendChild(button);
});

div.appendChild(container);
}

chatBox.appendChild(div);

chatBox.scrollTop=
chatBox.scrollHeight;
}

function displayMessage(
message,
sender="bot",
features=[],
type=""
){

renderMessage(
message,
sender,
features,
type
);

localMessages.push({
sender,
text:message,
features,
type,
timestamp:new Date().toISOString()
});

if(sender==="user"){

conversationContext.recentUserMessages.push(
message
);

conversationContext.recentUserMessages=
conversationContext.recentUserMessages.slice(-8);

}else{

conversationContext.recentBotMessages.push(
message
);

conversationContext.recentBotMessages=
conversationContext.recentBotMessages.slice(-8);
}

conversationContext.messageCount=
localMessages.length;

updateCurrentSession();
}

function getFeatureData(feature){

const features={
journal:{
label:"Open Journal",
url:"journal.html"
},
breathing:{
label:"Breathing Exercise",
url:"relaxation-tools.html"
},
calmingSounds:{
label:"Calming Sounds",
url:"relaxation-tools.html"
},
doodle:{
label:"Doodle Space",
url:"doodle.html"
},
story:{
label:"Motivational Read",
url:"story1.html"
},
voiceMemory:{
label:"Voice Memories",
url:"voice-memories.html"
}
};

return features[feature]||{
label:"Open Feature",
url:"#"
};
}

function openFeature(feature){

const data=
getFeatureData(feature);

if(data.url!=="#"){
window.location.href=data.url;
}
}

function showTyping(){

const typing=
document.createElement("div");

typing.id="typingIndicator";
typing.className="typing";

typing.innerHTML=
"<span></span><span></span><span></span>";

chatBox.appendChild(typing);

chatBox.scrollTop=
chatBox.scrollHeight;
}

function removeTyping(){

const typing=
document.getElementById(
"typingIndicator"
);

if(typing){
typing.remove();
}
}

function detectCrisis(text){

const t=
text
.toLowerCase()
.replace(/[’]/g,"'")
.trim();

const directPatterns=[
/\bi want to die\b/,
 /\bi wanna die\b/,
 /\bi want to kill myself\b/,
 /\bi wanna kill myself\b/,
 /\bi am going to kill myself\b/,
 /\bi'm going to kill myself\b/,
 /\bi might kill myself\b/,
 /\bi plan to kill myself\b/,
 /\bi am suicidal\b/,
 /\bi'm suicidal\b/,
 /\bkill myself\b/,
 /\bend my life\b/,
 /\btake my own life\b/,
 /\bhurt myself\b/,
 /\bharm myself\b/,
 /\bself[- ]harm\b/
];

const indirectPatterns=[
/\bi don't want to be here anymore\b/,
 /\bi do not want to be here anymore\b/,
 /\bi wish i wasn't alive\b/,
 /\bi wish i was dead\b/,
 /\bi wish i were dead\b/,
 /\beveryone would be better without me\b/,
 /\bpeople would be better off without me\b/,
 /\bno one would miss me\b/,
 /\bi can't do this anymore\b/,
 /\bi cannot do this anymore\b/,
 /\bthere's no point anymore\b/,
 /\bthere is no point anymore\b/,
 /\bi can't live like this\b/,
 /\bi cannot live like this\b/,
 /\bi don't want to wake up\b/,
 /\bi do not want to wake up\b/,
 /\bi want everything to stop\b/
];

if(
directPatterns.some(
pattern=>pattern.test(t)
)
){
return true;
}

if(
indirectPatterns.some(
pattern=>pattern.test(t)
)
){
return true;
}

if(
conversationContext.crisisContext &&
(
/\bi want to disappear\b/.test(t)||
/\bi want to go away\b/.test(t)||
/\bi can't go on\b/.test(t)||
/\bi cannot go on\b/.test(t)||
/\bi'm done\b/.test(t)||
/\bi am done\b/.test(t)
)
){
return true;
}

return false;
}

function updateContext(text){

const lower=
text.toLowerCase();

if(
detectCrisis(text)
){
conversationContext.crisisContext=true;
conversationContext.lastMood="crisis";
conversationContext.lastIntent="crisis";
conversationContext.conversationStage="safety";
return;
}

if(
/\b(exam|exams|test|assignment|college|class|study|studying|project|deadline)\b/.test(lower)
){
conversationContext.lastTopic=
"studies or academic work";
}

else if(
/\b(work|job|boss|office|career)\b/.test(lower)
){
conversationContext.lastTopic="work";
}

else if(
/\b(friend|friendship|relationship|family|parent|parents|brother|sister)\b/.test(lower)
){
conversationContext.lastTopic="relationships";
}

else if(
/\b(sleep|sleeping|insomnia|awake)\b/.test(lower)
){
conversationContext.lastTopic="sleep";
}

else if(
/\b(money|financial|finance|debt)\b/.test(lower)
){
conversationContext.lastTopic="money";
}

const emotions=[
{
name:"worthless",
words:[
"burden",
"worthless",
"useless",
"not good enough"
]
},
{
name:"lonely",
words:[
"lonely",
"alone",
"isolated",
"nobody understands"
]
},
{
name:"anxious",
words:[
"anxious",
"anxiety",
"panic",
"panicking",
"worried",
"nervous"
]
},
{
name:"overwhelmed",
words:[
"overwhelmed",
"too much",
"can't handle",
"cannot handle"
]
},
{
name:"angry",
words:[
"angry",
"furious",
"mad",
"irritated",
"annoyed"
]
},
{
name:"frustrated",
words:[
"frustrated",
"fed up"
]
},
{
name:"guilty",
words:[
"guilty",
"guilt",
"my fault",
"blame myself"
]
},
{
name:"hopeless",
words:[
"hopeless",
"no hope",
"nothing will change"
]
},
{
name:"depressed",
words:[
"depressed",
"depression"
]
},
{
name:"sad",
words:[
"sad",
"upset",
"crying",
"heartbroken",
"miserable",
"empty"
]
},
{
name:"tired",
words:[
"tired",
"exhausted",
"drained",
"burnt out",
"burned out"
]
},
{
name:"happy",
words:[
"happy",
"great",
"amazing",
"wonderful",
"glad"
]
},
{
name:"excited",
words:[
"excited",
"thrilled",
"can't wait"
]
}
];

for(const emotion of emotions){

if(
emotion.words.some(
word=>lower.includes(word)
)
){

conversationContext.lastMood=
emotion.name;

conversationContext.moodHistory.push(
emotion.name
);

conversationContext.moodHistory=
conversationContext.moodHistory.slice(-10);

break;
}
}

conversationContext.recentUserMessages.push(text);

conversationContext.recentUserMessages=
conversationContext.recentUserMessages.slice(-8);

conversationContext.messageCount=
localMessages.length;
}

async function getAIResponse(message){

try{

const history=
localMessages
.slice(-14)
.map(item=>({
role:
item.sender==="bot"
?"assistant"
:"user",
content:item.text
}));

const response=
await fetch(
"/api/ai",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message,
history,
context:{
...conversationContext,
sessionId:currentSessionId
}
})
}
);

const data=
await response.json();

if(
!response.ok ||
!data.response
){
throw new Error(
data.error||
"AI request failed"
);
}

return data.response;

}catch(error){

console.error(
"MindEase AI error:",
error
);

return null;
}

}

function localCrisisResponse(){

return "I'm really sorry you're hurting this much. I'm taking what you just said seriously. Please don't stay alone with this right now. If you can, move somewhere safe and contact someone you trust so they can stay with you.\n\nIf you think you might hurt yourself or you're in immediate danger, call 112 in India or go to the nearest emergency department. You can also contact Tele-MANAS at 14416 or 1-800-891-4416 for 24/7 mental-health support.";
}

async function handleMessage(message){

if(!message)return;

displayMessage(
message,
"user"
);

updateContext(message);

userInput.value="";
sendButton.disabled=true;

if(detectCrisis(message)){

conversationContext.crisisContext=true;

displayMessage(
localCrisisResponse(),
"bot",
[],
"crisis"
);

sendButton.disabled=false;
userInput.focus();
return;
}

showTyping();

const response=
await getAIResponse(message);

removeTyping();

if(response){

displayMessage(
response,
"bot"
);

}else{

displayMessage(
"Sorry, I'm having trouble connecting right now. Please try again in a moment.",
"bot"
);
}

sendButton.disabled=false;
userInput.focus();
}

chatForm.addEventListener(
"submit",
async event=>{

event.preventDefault();

const message=
userInput.value.trim();

if(
!message||
sendButton.disabled
){
return;
}

await handleMessage(message);
}
);

newChatBtn.addEventListener(
"click",
()=>{

if(
localMessages.some(
message=>message.sender==="user"
)
){
updateCurrentSession();
}

createSession();
userInput.focus();
}
);

exportBtn.addEventListener(
"click",
()=>{

if(!localMessages.length){

alert(
"There is no conversation to export yet."
);

return;
}

const text=
localMessages
.map(message=>{

const sender=
message.sender==="user"
?"YOU"
:"MINDEASE AI";

return`${sender}: ${message.text}`;

})
.join("\n\n");

const blob=
new Blob(
[text],
{type:"text/plain"}
);

const url=
URL.createObjectURL(blob);

const link=
document.createElement("a");

link.href=url;

link.download=
`mindease_chat_${Date.now()}.txt`;

link.click();

URL.revokeObjectURL(url);
}
);

clearBtn.addEventListener(
"click",
()=>{

const confirmed=
confirm(
"Delete all saved MindEase conversations? This cannot be undone."
);

if(!confirmed)return;

localStorage.removeItem(
STORAGE_KEY
);

chatSessions=[];
currentSessionId=null;
localMessages=[];

createSession();
renderHistory();
}
);

fileInput.addEventListener(
"change",
()=>{

const file=
fileInput.files[0];

if(!file)return;

displayMessage(
`You shared an image: ${file.name}`,
"user"
);

displayMessage(
"Thanks for sharing it. Image understanding isn't connected to MindEase yet, but you can tell me what you'd like me to notice or talk about.",
"bot"
);

fileInput.value="";
}
);

userInput.addEventListener(
"keydown",
event=>{

if(
event.key==="Enter" &&
!event.shiftKey
){

event.preventDefault();

chatForm.requestSubmit();
}
}
);

loadSessions();

if(chatSessions.length){

const latest=
chatSessions[0];

if(
latest.messages &&
latest.messages.some(
message=>message.sender==="user"
)
){

loadSession(latest.id);

}else{

createSession();
}

}else{

createSession();
}

renderHistory();

userInput.focus();
</script>

</body>
</html>
