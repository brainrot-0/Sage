<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MindEase AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',sans-serif;background:#e8ded2;color:#4d443d;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.background-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#e8ded2,#d8c9ba,#eee5dc);z-index:-1}
.layout{width:95%;max-width:1400px;height:90vh;display:flex;background:rgba(255,255,255,.45);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.6);border-radius:25px;box-shadow:0 20px 60px rgba(75,60,45,.15);overflow:hidden}
.sidebar{width:280px;padding:25px 18px;display:flex;flex-direction:column;background:rgba(255,255,255,.28);border-right:1px solid rgba(255,255,255,.5)}
.logo{text-align:center;font-size:24px;font-weight:600;color:#62564c;margin-bottom:25px}
.logo i{margin-right:8px}
.sidebar-btn{width:100%;border:none;border-radius:12px;padding:12px 15px;margin-bottom:10px;background:rgba(255,255,255,.55);color:#5e5349;font-family:'Poppins',sans-serif;font-size:14px;cursor:pointer;transition:.25s;text-align:left}
.sidebar-btn:hover{background:rgba(255,255,255,.85);transform:translateY(-1px)}
.sidebar-btn i{width:22px}
.chat-history-list{flex:1;overflow-y:auto;margin-top:12px;padding-right:4px}
.chat-history-list::-webkit-scrollbar,.chat-box::-webkit-scrollbar{width:5px}
.chat-history-list::-webkit-scrollbar-thumb,.chat-box::-webkit-scrollbar-thumb{background:rgba(100,85,70,.25);border-radius:10px}
.history-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#8a7b6d;margin:15px 8px 10px}
.chat-thread{padding:11px 12px;border-radius:10px;margin-bottom:6px;font-size:13px;color:#62574e;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.2s}
.chat-thread:hover{background:rgba(255,255,255,.55)}
.chat-thread.active{background:rgba(255,255,255,.75);font-weight:500}
.chat-area{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-header{height:75px;padding:0 30px;display:flex;align-items:center;border-bottom:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.2)}
.chat-header h1{font-size:20px;font-weight:600;color:#554a42}
.chat-header p{font-size:12px;color:#897b6e;margin-top:2px}
.chat-box{flex:1;overflow-y:auto;padding:30px 8%;scroll-behavior:smooth}
.chat-message{max-width:75%;padding:13px 17px;margin-bottom:15px;border-radius:18px;line-height:1.6;font-size:14px;animation:fadeIn .25s ease;white-space:pre-wrap;word-wrap:break-word}
.chat-message.user{margin-left:auto;background:#b8a99a;color:#fff;border-bottom-right-radius:5px}
.chat-message.bot{margin-right:auto;background:rgba(255,255,255,.72);color:#554a42;border-bottom-left-radius:5px}
.chat-message.crisis{background:rgba(255,244,238,.95);border:1px solid rgba(180,100,70,.3);color:#5d4037}
.feature-container{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.feature-btn{border:none;background:#d8c8b8;color:#5a4d42;padding:8px 11px;border-radius:10px;font-family:'Poppins',sans-serif;font-size:12px;cursor:pointer;transition:.2s}
.feature-btn:hover{background:#cbb8a6;transform:translateY(-1px)}
.chat-form{padding:18px 6%;display:flex;align-items:center;gap:10px;border-top:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.18)}
.chat-form input[type="text"]{flex:1;border:none;outline:none;background:rgba(255,255,255,.72);padding:13px 17px;border-radius:14px;font-family:'Poppins',sans-serif;color:#51463d;font-size:14px}
.chat-form input[type="text"]::placeholder{color:#9a8b7d}
.chat-form button{border:none;width:46px;height:46px;border-radius:13px;background:#9e8d7c;color:#fff;cursor:pointer;transition:.2s}
.chat-form button:hover{background:#887665;transform:translateY(-1px)}
.file-upload{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.65);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#76685b;transition:.2s}
.file-upload:hover{background:rgba(255,255,255,.9)}
.file-upload input{display:none}
.bot-prompt{font-size:12px;color:#918276;text-align:center;margin-top:5px}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:768px){
body{overflow:auto}
.layout{width:100%;height:100vh;border-radius:0}
.sidebar{display:none}
.chat-box{padding:25px 5%}
.chat-message{max-width:88%}
.chat-form{padding:15px 4%}
}
</style>
</head>

</main>
</div>

function randomResponse(list){
return list[Math.floor(Math.random()*list.length)];
}

function createId(){
return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}

function saveSessions(){
localStorage.setItem(STORAGE_KEY,JSON.stringify(chatSessions));
}

function loadSessions(){
try{
const saved=localStorage.getItem(STORAGE_KEY);
chatSessions=saved?JSON.parse(saved):[];
if(!Array.isArray(chatSessions))chatSessions=[];
}catch{
chatSessions=[];
}
}

function createContext(){
return{
userName:"",
lastMood:"neutral",
moodHistory:[],
lastTopic:"",
lastIntent:"",
lastSuggestion:"",
recentUserMessages:[],
recentBotMessages:[],
messageCount:0,
sessionStart:new Date().toISOString()
};
}

function createSession(){
currentSessionId=createId();
localMessages=[];
conversationContext=createContext();
chatBox.innerHTML="";
const session={
id:currentSessionId,
title:"New conversation",
messages:[],
context:conversationContext,
createdAt:new Date().toISOString(),
updatedAt:new Date().toISOString()
};
chatSessions.unshift(session);
saveSessions();
renderHistory();
displayMessage("Hello! I’m glad you’re here. Think of me as a friendly space where you can talk, reflect, or simply have a casual conversation. How are you feeling today?","bot",[]);
}

function getCurrentSession(){
return chatSessions.find(session=>session.id===currentSessionId);
}

function updateCurrentSession(){
const session=getCurrentSession();
if(!session)return;
session.messages=localMessages;
session.context=conversationContext;
session.updatedAt=new Date().toISOString();
if(localMessages.some(message=>message.sender==="user")){
const firstUser=localMessages.find(message=>message.sender==="user");
if(firstUser)session.title=firstUser.text.length>35?firstUser.text.slice(0,35)+"...":firstUser.text;
}
saveSessions();
renderHistory();
}

function loadSession(id){
const session=chatSessions.find(item=>item.id===id);
if(!session)return;
currentSessionId=id;
localMessages=Array.isArray(session.messages)?session.messages:[];
conversationContext=session.context||createContext();
chatBox.innerHTML="";
localMessages.forEach(message=>{
renderMessage(message.text,message.sender,message.features||[],message.type||"");
});
renderHistory();
chatBox.scrollTop=chatBox.scrollHeight;
}

function renderHistory(){
chatHistory.innerHTML="";
const sessions=chatSessions.filter(session=>session.messages&&session.messages.some(message=>message.sender==="user"));
if(!sessions.length){
const empty=document.createElement("div");
empty.style.cssText="font-size:12px;color:#9a8b7d;padding:10px 8px";
empty.textContent="Your conversations will appear here.";
chatHistory.appendChild(empty);
return;
}
sessions.slice(0,20).forEach(session=>{
const item=document.createElement("div");
item.className="chat-thread"+(session.id===currentSessionId?" active":"");
item.textContent=session.title||"Conversation";
item.title=session.title||"Conversation";
item.addEventListener("click",()=>loadSession(session.id));
chatHistory.appendChild(item);
});
}

function renderMessage(message,sender="bot",features=[],type=""){
const div=document.createElement("div");
div.className="chat-message "+sender+(type==="crisis"?" crisis":"");
div.textContent=message;
if(features.length){
const container=document.createElement("div");
container.className="feature-container";
features.forEach(feature=>{
const button=document.createElement("button");
button.className="feature-btn";
button.type="button";
button.textContent=getFeatureLabel(feature).label;
button.addEventListener("click",()=>{
conversationContext.lastSuggestion=feature;
openFeature(feature);
});
container.appendChild(button);
});
div.appendChild(container);
}
chatBox.appendChild(div);
chatBox.scrollTop=chatBox.scrollHeight;
}

function displayMessage(message,sender="bot",features=[],type=""){
renderMessage(message,sender,features,type);
localMessages.push({
sender,
text:message,
features,
type,
timestamp:new Date().toISOString()
});
if(sender==="user"){
conversationContext.recentUserMessages.push(message);
if(conversationContext.recentUserMessages.length>8)conversationContext.recentUserMessages.shift();
conversationContext.messageCount++;
}else{
conversationContext.recentBotMessages.push(message);
if(conversationContext.recentBotMessages.length>8)conversationContext.recentBotMessages.shift();
}
updateCurrentSession();
}

function getFeatureLabel(feature){
const labels={
journal:{label:"Open Journal",url:"journal.html"},
breathing:{label:"Breathing Exercise",url:"relaxation-tools.html"},
calmingSounds:{label:"Calming Sounds",url:"relaxation-tools.html"},
doodle:{label:"Doodle Space",url:"doodle.html"},
story:{label:"Motivational Read",url:"story1.html"},
voiceMemory:{label:"Voice Memories",url:"voice-memories.html"}
};
return labels[feature]||{label:"Open Feature",url:"#"};
}

function openFeature(feature){
const data=getFeatureLabel(feature);
if(data.url&&data.url!=="#")window.location.href=data.url;
}

function detectExtremeDistress(text){
const normalized=text.toLowerCase().replace(/[’]/g,"'");
const patterns=[
/\b(i|i'm|i am|i feel|i want|i wanna)\s+(want to|wanna|feel like|am going to|need to)?\s*(die|kill myself|end my life|take my life)\b/,
 /\b(kill myself|kill my self|suicide|end it all|end my life|take my life)\b/,
 /\b(don't want to live|dont want to live|can't go on|cant go on)\b/,
 /\b(i can't take this anymore|i cant take this anymore)\b/,
 /\b(feel like dying|want to disappear forever|no reason to live|better off dead)\b/,
 /\b(hurt myself|harm myself|self harm|self-harm)\b/
];
return patterns.some(pattern=>pattern.test(normalized));
}

function detectMood(text){
const t=text.toLowerCase().replace(/[’]/g,"'").trim();

const negativePatterns=[
/\bi\s*(do not|don't|dont|no longer)\s+(feel|feeling)\s+(good|great|happy|wonderful|amazing|fine|okay|ok)\b/,
 /\bi\s*(am not|ain't|amn't)\s+(happy|good|great|fine|okay|ok)\b/,
 /\bnot\s+(happy|good|great|fine|okay|ok)\b/,
 /\bfeel(ing)?\s+(bad|low|down|sad|terrible|awful|horrible|empty|lonely|miserable|hopeless)\b/,
 /\bi\s*(do not|don't|dont)\s+feel\s+(well|okay|fine)\b/,
 /\bnot\s+feeling\s+(well|good|great|happy|okay|fine)\b/
];

if(negativePatterns.some(pattern=>pattern.test(t)))return"sad";

const stressedPatterns=[
/\b(stressed|stress|overwhelmed|overwhelming|anxious|anxiety|panic|panicking|worried|worry|nervous|too much|exhausted|burnt out|burnout|tension)\b/,
 /\bunder\s+(a lot of\s+)?pressure\b/,
 /\btoo\s+much\s+on\s+my\s+mind\b/,
 /\bcan't\s+handle\s+(all\s+)?this\b/,
 /\bcannot\s+handle\s+(all\s+)?this\b/
];

if(stressedPatterns.some(pattern=>pattern.test(t)))return"stressed";

const angryPatterns=[
/\b(angry|mad|furious|irritated|annoyed|frustrated|frustrating|rage|raging|fed up|hate this)\b/,
 /\bthis\s+is\s+so\s+annoying\b/,
 /\bthis\s+is\s+driving\s+me\s+crazy\b/
];

if(angryPatterns.some(pattern=>pattern.test(t)))return"angry";

const sadPatterns=[
/\b(sad|down|depressed|cry|crying|lonely|hopeless|unhappy|heartbroken|miserable|empty|hurt|feeling low|bad day)\b/,
 /\bi\s+feel\s+(bad|low|down|sad|terrible|awful|horrible|empty|lonely)\b/,
 /\bi\s+don't\s+feel\s+(well|good|great|okay|fine)\b/,
 /\bi\s+dont\s+feel\s+(well|good|great|okay|fine)\b/,
 /\bi\s+am\s+not\s+feeling\s+(good|well|great|okay|fine)\b/,
 /\bi'm\s+not\s+feeling\s+(good|well|great|okay|fine)\b/
];

if(sadPatterns.some(pattern=>pattern.test(t)))return"sad";

const happyPatterns=[
/\b(happy|excited|awesome|amazing|wonderful|joyful|glad|fantastic|love it|proud|thrilled|yay)\b/,
 /\bi\s+feel\s+(good|great|happy|wonderful|amazing|fantastic)\b/,
 /\bi'm\s+(good|great|happy|fine|okay|excited)\b/,
 /\bi\s+am\s+(good|great|happy|fine|okay|excited)\b/,
 /\bfeeling\s+(good|great|happy|wonderful|amazing|fantastic)\b/
];

if(happyPatterns.some(pattern=>pattern.test(t)))return"happy";

return"neutral";
}

function detectCasualConversation(text){
const t=text.toLowerCase().trim();
if(/^(hi|hello|hey|hii|hiii|good morning|good afternoon|good evening|howdy)\b/.test(t))return"greeting";
if(/\bhow are you\b|\bhow're you\b/.test(t))return"howAreYou";
if(/\b(thank you|thanks|thx|appreciate it)\b/.test(t))return"thanks";
if(/\b(bye|goodbye|see you|see ya|talk later|good night)\b/.test(t))return"goodbye";
if(/\bhow was my day\b|\bhow is my day\b|\bhow's my day\b|\bhow was your day\b|\btell me about my day\b/.test(t))return"day";
if(/\bwhat('?s| is) your name\b|\bwho are you\b|\bwhat should i call you\b/.test(t))return"name";
if(/\b(you're nice|you are nice|you're helpful|you are helpful|good bot|i like you|love you)\b/.test(t))return"compliment";
if(/\b(tell me a joke|make me laugh|joke)\b/.test(t))return"joke";
return"";
}

function extractUserName(text){
const t=text.trim();
let match=t.match(/^(?:my name is|call me)\s+([a-zA-Z][a-zA-Z\s'-]{1,25})$/i);
if(!match)match=t.match(/^i(?:'m| am)\s+([a-zA-Z][a-zA-Z\s'-]{1,25})$/i);
if(!match)return"";
const name=match[1].trim();
const rejected=["sad","happy","tired","stressed","angry","fine","good","bad","okay","ok","anxious","worried","lonely","depressed","frustrated","mad","excited","bored","confused","scared","upset"];
if(rejected.includes(name.toLowerCase()))return"";
return name.split(/\s+/).map(word=>word.charAt(0).toUpperCase()+word.slice(1).toLowerCase()).join(" ");
}

function detectIntent(text){
const t=text.toLowerCase().trim();
if(/^(yes|yeah|yep|sure|okay|ok|alright|please|do it|go ahead)$/.test(t))return"confirmation";
if(/^(no|nope|not really|nah)$/.test(t))return"negative";
if(/\b(do you remember|remember my name|what('?s| is) my name|did i tell you my name)\b/.test(t))return"memory";
if(/\b(what should i do|what can i do|what do i do|any advice|give me advice|help me)\b/.test(t))return"advice";
if(/\b(tell me more|more about that|explain that|continue|go on|and then|what else)\b/.test(t))return"continue";
if(/\b(why|how come)\b/.test(t)&&conversationContext.lastMood!=="neutral")return"why";
if(/\b(still|again|yet)\b/.test(t)&&detectMood(t)!=="neutral")return"followupMood";
if(/\b(i feel better|feeling better|i'm better|i am better|much better|calmer now|i'm okay now|i am okay now)\b/.test(t))return"improvement";
if(/\b(this|that|it|something|everything)\b/.test(t)&&conversationContext.lastTopic)return"contextReference";
return"";
}

function rememberTopic(text,mood){
const t=text.toLowerCase();
if(mood!=="neutral"){
conversationContext.lastTopic=mood+" feelings";
return;
}
if(/\b(exam|exams|test|assignment|college|class|study|studying|project|deadline)\b/.test(t)){
conversationContext.lastTopic="studies or academic work";
return;
}
if(/\b(work|job|boss|office|career)\b/.test(t)){
conversationContext.lastTopic="work";
return;
}
if(/\b(friend|friendship|relationship|family|parent|parents|brother|sister)\b/.test(t)){
conversationContext.lastTopic="relationships";
return;
}
if(/\b(sleep|sleeping|insomnia|awake)\b/.test(t)){
conversationContext.lastTopic="sleep";
return;
}
if(/\b(money|financial|finance|debt)\b/.test(t)){
conversationContext.lastTopic="money";
return;
}
conversationContext.lastTopic="what you are currently dealing with";
}

function getMoodSuggestion(mood){
if(mood==="sad")return{message:"Since you’ve been feeling low, you could write down what’s bothering you or put on something calming for a little while.",features:["journal","calmingSounds"]};
if(mood==="stressed")return{message:"Since you’ve been feeling stressed, I’d suggest taking a short breathing break and giving your mind a few quiet minutes.",features:["breathing","calmingSounds"]};
if(mood==="angry")return{message:"Since you’re feeling frustrated, giving yourself some space before reacting may help. You could also doodle or take a few slow breaths.",features:["breathing","doodle"]};
if(mood==="happy")return{message:"Since you’re feeling good, you could capture the moment in your journal or spend a little time doing something creative.",features:["journal","doodle"]};
return{message:"You could take a quiet moment, write down what is on your mind, or simply keep talking to me.",features:["journal"]};
}

function getContextualResponse(userText){
const intent=detectIntent(userText);
const mood=detectMood(userText);
const name=extractUserName(userText);

if(name){
conversationContext.userName=name;
conversationContext.lastIntent="nameProvided";
return{
message:`It’s nice to meet you, ${name}. I’ll remember your name during our conversations here. What would you like to talk about?`,
features:[]
};
}

if(intent==="memory"){
conversationContext.lastIntent="memory";
if(conversationContext.userName){
return{message:`Yes. You told me your name is ${conversationContext.userName}.`,features:[]};
}
return{message:"You haven’t told me your name yet. If you’d like, you can say something like “My name is Alex.”",features:[]};
}

if(intent==="confirmation"&&conversationContext.lastSuggestion){
const label=getFeatureLabel(conversationContext.lastSuggestion).label;
return{
message:`Of course. Let’s go with ${label}. You can open it using the button below.`,
features:[conversationContext.lastSuggestion]
};
}

if(intent==="improvement"){
conversationContext.lastMood="happy";
conversationContext.moodHistory.push("improving");
return{
message:"I’m really glad to hear that. Even a small improvement matters. Try to give yourself credit for getting through the difficult moment.",
features:["journal","doodle"]
};
}

if(intent==="followupMood"){
conversationContext.lastMood=mood;
conversationContext.moodHistory.push(mood);
rememberTopic(userText,mood);
if(mood==="stressed")return{message:"It sounds like the stress is still hanging around. Let’s not try to solve everything at once. What is the biggest thing weighing on you right now?",features:["breathing","calmingSounds"]};
if(mood==="sad")return{message:"I hear you. If the sadness is still there, you don’t have to force it away. What part of it feels hardest right now?",features:["journal","calmingSounds"]};
if(mood==="angry")return{message:"You’re still feeling frustrated, and that’s okay to talk about. What is continuing to bother you?",features:["breathing","doodle"]};
if(mood==="happy")return{message:"I’m glad the good feeling is still there. What has been making you feel this way?",features:["journal","doodle"]};
}

if(intent==="advice"){
const suggestion=getMoodSuggestion(conversationContext.lastMood);
return{message:`Based on what you’ve been telling me, ${suggestion.message.toLowerCase().charAt(0).toUpperCase()+suggestion.message.slice(1)}`,features:suggestion.features};
}

if(intent==="continue"||intent==="why"||intent==="contextReference"){
const moodToUse=conversationContext.lastMood;
if(moodToUse!=="neutral"){
if(moodToUse==="sad")return{message:"When you’re feeling low, it can help to understand what is underneath the feeling instead of judging yourself for having it. If you want, tell me what happened before you started feeling this way.",features:["journal"]};
if(moodToUse==="stressed")return{message:"Stress often becomes stronger when several things feel urgent at once. We can separate them and look at one thing at a time. What feels most urgent right now?",features:["breathing"]};
if(moodToUse==="angry")return{message:"Anger often points toward something that felt unfair, hurtful or frustrating. If you want, tell me what happened and we can unpack it.",features:["doodle"]};
if(moodToUse==="happy")return{message:"Let’s keep talking about the good part. What exactly made you feel happy or proud?",features:["journal"]};
}
return{message:`You were talking about ${conversationContext.lastTopic||"what has been on your mind"}. Tell me more about that and I’ll follow along.`,features:[]};
}

if(mood!=="neutral"){
conversationContext.lastMood=mood;
conversationContext.moodHistory.push(mood);
if(conversationContext.moodHistory.length>10)conversationContext.moodHistory.shift();
conversationContext.lastIntent="mood";
rememberTopic(userText,mood);
if(mood==="sad")return{message:randomResponse(aiDatabase.sad),features:["journal","calmingSounds"]};
if(mood==="stressed")return{message:randomResponse(aiDatabase.stressed),features:["breathing","calmingSounds"]};
if(mood==="happy")return{message:randomResponse(aiDatabase.happy),features:["journal","doodle"]};
if(mood==="angry")return{message:randomResponse(aiDatabase.angry),features:["breathing","doodle"]};
}

conversationContext.lastIntent="neutral";
return{message:randomResponse(aiDatabase.neutral),features:[]};
}

function getBotResponse(userText){
if(detectExtremeDistress(userText)){
conversationContext.lastIntent="crisis";
return{
type:"crisis",
message:"I’m really sorry you’re feeling this much pain right now. You matter, and I don’t want you to face this moment alone. If you might hurt yourself or are in immediate danger, please call your local emergency services now or go to the nearest hospital. If you can, please move toward a trusted person and tell them clearly that you need help right now.",
crisisMessage:"India support: For immediate emergencies, call 112. For 24/7 mental-health support, Tele-MANAS can be reached at 14416 or 1-800-891-4416. If possible, please stay with someone you trust while you seek help.",
features:["breathing","journal"]
};
}
const mood=detectMood(userText);
if(mood!=="neutral"){
conversationContext.lastMood=mood;
conversationContext.moodHistory.push(mood);
if(conversationContext.moodHistory.length>10){
conversationContext.moodHistory.shift();
}
rememberTopic(userText,mood);
conversationContext.lastIntent="mood";
if(mood==="sad"){
return{
message:randomResponse(aiDatabase.sad),
features:["journal","calmingSounds"]
};
}
if(mood==="stressed"){
return{
message:randomResponse(aiDatabase.stressed),
features:["breathing","calmingSounds"]
};
}
if(mood==="happy"){
return{
message:randomResponse(aiDatabase.happy),
features:["journal","doodle"]
};
}
if(mood==="angry"){
return{
message:randomResponse(aiDatabase.angry),
features:["breathing","doodle"]
};
}
}
const casual=detectCasualConversation(userText);
if(casual){
conversationContext.lastIntent=casual;
if(casual==="greeting"){
return{message:randomResponse(casualResponses.greeting),features:[]};
}
if(casual==="howAreYou"){
return{message:randomResponse(casualResponses.howAreYou),features:[]};
}
if(casual==="thanks"){
return{message:randomResponse(casualResponses.thanks),features:[]};
}
if(casual==="goodbye"){
return{message:randomResponse(casualResponses.goodbye),features:[]};
}
if(casual==="day"){
return{message:randomResponse(casualResponses.day),features:[]};
}
if(casual==="name"){
return{message:randomResponse(casualResponses.name),features:[]};
}
if(casual==="compliment"){
return{message:randomResponse(casualResponses.compliment),features:[]};
}
if(casual==="joke"){
return{message:randomResponse(casualResponses.joke),features:[]};
}
}
return getContextualResponse(userText);
}

chatForm.addEventListener("submit",event=>{
event.preventDefault();
const message=userInput.value.trim();
if(!message)return;
displayMessage(message,"user");
userInput.value="";
userInput.focus();
setTimeout(()=>{
const response=getBotResponse(message);
displayMessage(response.message,"bot",response.features||[],response.type||"");
if(response.type==="crisis")displayMessage(response.crisisMessage,"bot",[], "crisis");
},450);
});

newChatBtn.addEventListener("click",()=>{
if(localMessages.some(message=>message.sender==="user"))updateCurrentSession();
createSession();
userInput.focus();
});

exportBtn.addEventListener("click",()=>{
if(!localMessages.length){
alert("There is no conversation to export yet.");
return;
}
const text=localMessages.map(message=>{
const sender=message.sender==="user"?"YOU":"MINDEASE AI";
return`${sender}: ${message.text}`;
}).join("\n\n");
const blob=new Blob([text],{type:"text/plain"});
const url=URL.createObjectURL(blob);
const link=document.createElement("a");
link.href=url;
link.download=`mindease_chat_${Date.now()}.txt`;
link.click();
URL.revokeObjectURL(url);
});

clearBtn.addEventListener("click",()=>{
if(!confirm("Delete all saved MindEase conversations? This cannot be undone."))return;
localStorage.removeItem(STORAGE_KEY);
chatSessions=[];
currentSessionId=null;
localMessages=[];
conversationContext=createContext();
chatHistory.innerHTML="";
chatBox.innerHTML="";
createSession();
});

fileInput.addEventListener("change",()=>{
const file=fileInput.files[0];
if(!file)return;
displayMessage(`You shared an image: ${file.name}`,"user");
setTimeout(()=>{
displayMessage("Thanks for sharing it. I can see that you uploaded an image, but this version of MindEase does not have image understanding connected yet. If you tell me what the image means or what you want me to notice, I can still talk it through with you.", "bot");
},450);
fileInput.value="";
});

loadSessions();

if(chatSessions.length){
const latest=chatSessions[0];
if(latest.messages&&latest.messages.some(message=>message.sender==="user")){
loadSession(latest.id);
}else{
chatSessions=chatSessions.filter(session=>session.messages&&session.messages.length);
if(chatSessions.length)loadSession(chatSessions[0].id);
else createSession();
}
}else{
createSession();
}

renderHistory();
userInput.focus();
</script>
</body>
</html>
