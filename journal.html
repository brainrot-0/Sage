<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Journaling Space</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
rel="stylesheet">

<style>


/* =========================
   GLOBAL
========================= */


*{
  box-sizing:border-box;
}


body{

  font-family:'Poppins',sans-serif;

  background:#fff5e6;

  color:#2b2b2b;

  margin:0;

  padding:0;

}



/* =========================
   HEADER
========================= */


header{

  text-align:center;

  padding:30px 20px 20px;

}


header h1{

  font-size:36px;

  margin-bottom:5px;

  color:#b29b80;

}


header p{

  font-size:16px;

  color:#666;

  margin-top:5px;

}



/* =========================
   MAIN CONTAINER
========================= */


.journal-container{

  max-width:900px;

  margin:0 auto;

  padding:20px;

}



/* =========================
   CREATE JOURNAL
========================= */


.journal-controls{

  display:flex;

  gap:10px;

  margin-bottom:20px;

  flex-wrap:wrap;

}


.journal-controls input{

  padding:10px 14px;

  border-radius:12px;

  border:1px solid #d8c7b3;

  font-family:'Poppins',sans-serif;

  font-size:14px;

  flex:1;

  min-width:200px;

}


.journal-controls select{

  padding:10px 12px;

  border-radius:12px;

  border:1px solid #d8c7b3;

  font-family:'Poppins',sans-serif;

  background:white;

}


button{

  padding:10px 16px;

  border:none;

  border-radius:12px;

  background:#b29b80;

  color:white;

  font-family:'Poppins',sans-serif;

  font-weight:500;

  cursor:pointer;

  transition:all 0.25s;

}


button:hover{

  background:#9b886e;

  transform:translateY(-1px);

}


button:active{

  transform:scale(0.97);

}



/* =========================
   JOURNAL LIST
========================= */


.journal-list{

  display:flex;

  gap:12px;

  margin-bottom:20px;

  overflow-x:auto;

  padding:5px 3px 12px;

}


.journal-card{

  position:relative;

  padding:14px 20px;

  min-width:150px;

  border-radius:16px;

  cursor:pointer;

  flex-shrink:0;

  transition:0.25s;

  box-shadow:
  0 5px 15px rgba(0,0,0,0.08);

}


.journal-card:hover{

  transform:translateY(-3px);

}


.journal-card.active{

  transform:translateY(-3px);

  box-shadow:
  0 10px 22px rgba(0,0,0,0.16);

}


.journal-title{

  font-size:14px;

  font-weight:600;

  color:#333;

}


.journal-count{

  font-size:11px;

  margin-top:3px;

  opacity:0.7;

}



/* DELETE JOURNAL */


.delete-journal{

  position:absolute;

  top:7px;

  right:8px;

  width:22px;

  height:22px;

  padding:0;

  border-radius:50%;

  font-size:12px;

  background:rgba(255,255,255,0.5);

  color:#555;

}


.delete-journal:hover{

  background:#fff;

}



/* =========================
   WRITING AREA
========================= */


.write-area{

  background:rgba(255,255,255,0.7);

  padding:20px;

  border-radius:18px;

  box-shadow:
  0 6px 20px rgba(0,0,0,0.06);

  margin-bottom:25px;

}


.entry-top{

  display:flex;

  gap:10px;

  margin-bottom:12px;

  flex-wrap:wrap;

}


#entryTitle{

  flex:1;

  min-width:200px;

  padding:10px 14px;

  border-radius:10px;

  border:1px solid #ddd;

  font-family:'Poppins',sans-serif;

}


#moodSelector{

  padding:10px;

  border-radius:10px;

  border:1px solid #ddd;

  font-family:'Poppins',sans-serif;

}


textarea{

  width:100%;

  min-height:260px;

  padding:18px;

  border-radius:14px;

  border:1px solid #e5ded6;

  font-family:'Poppins',sans-serif;

  font-size:15px;

  line-height:1.7;

  resize:vertical;

  outline:none;

  background:white;

  transition:0.2s;

}


textarea:focus{

  border-color:#b29b80;

  box-shadow:
  0 0 0 3px rgba(178,155,128,0.12);

}



/* =========================
   WRITING FOOTER
========================= */


.editor-footer{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-top:12px;

  gap:10px;

  flex-wrap:wrap;

}


#wordCount{

  font-size:12px;

  color:#888;

}


#saveStatus{

  font-size:12px;

  color:#888;

}



/* =========================
   SAVED ENTRIES
========================= */


.saved-entries{

  margin-top:20px;

}


.saved-entries h2{

  font-size:20px;

  color:#7f6d59;

  margin-bottom:15px;

}


.entry{

  position:relative;

  padding:18px;

  border-radius:15px;

  margin-bottom:12px;

  box-shadow:
  0 4px 14px rgba(0,0,0,0.07);

  transition:0.2s;

}


.entry:hover{

  transform:translateY(-2px);

}


.entry-title{

  font-weight:600;

  font-size:16px;

  margin-bottom:4px;

}


.entry-date{

  font-size:11px;

  color:#777;

  margin-bottom:10px;

}


.entry-mood{

  display:inline-block;

  font-size:12px;

  background:rgba(255,255,255,0.5);

  padding:4px 9px;

  border-radius:20px;

  margin-bottom:10px;

}


.entry-content{

  white-space:pre-wrap;

  font-size:14px;

  line-height:1.6;

  padding-right:35px;

}



/* ENTRY ACTIONS */


.entry-actions{

  position:absolute;

  top:12px;

  right:12px;

  display:flex;

  gap:5px;

}


.entry-actions button{

  width:28px;

  height:28px;

  padding:0;

  border-radius:50%;

  font-size:12px;

}



/* =========================
   EMPTY STATE
========================= */


.empty-state{

  text-align:center;

  padding:30px;

  background:rgba(255,255,255,0.5);

  border-radius:16px;

  color:#888;

}


.empty-icon{

  font-size:30px;

  margin-bottom:8px;

}



/* =========================
   RESPONSIVE
========================= */


@media(max-width:600px){

  header h1{

    font-size:28px;

  }


  header p{

    font-size:14px;

  }


  .journal-container{

    padding:12px;

  }


  .editor-footer{

    align-items:flex-start;

  }

}


</style>

</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

  <h1>Journaling Space</h1>

  <p>
    A quiet space to write your thoughts,
    understand your feelings, and reflect.
  </p>

</header>

<!-- =========================
     MAIN JOURNAL CONTAINER
========================= -->

<div class="journal-container">

  <!-- CREATE JOURNAL -->

  <div class="journal-controls">

```
<input
type="text"
id="newJournalName"
placeholder="Create a new journal...">


<select id="journalColor">

  <option value="#ffadad">
  Soft Red
  </option>

  <option value="#ffd6a5">
  Warm Orange
  </option>

  <option value="#fdffb6">
  Soft Yellow
  </option>

  <option value="#caffbf">
  Calm Green
  </option>

  <option value="#9bf6ff">
  Sky Blue
  </option>

  <option value="#a0c4ff">
  Blue
  </option>

  <option value="#bdb2ff">
  Lavender
  </option>

</select>


<button id="addJournalBtn">

  + Add Journal

</button>
```

  </div>

  <!-- JOURNAL LIST -->

  <div
  class="journal-list"
  id="journalList">

  </div>

  <!-- WRITING AREA -->

  <div class="write-area">

```
<div class="entry-top">


  <input
  type="text"
  id="entryTitle"
  placeholder="Give your entry a title...">


  <select id="moodSelector">

    <option value="😊 Happy">
    😊 Happy
    </option>

    <option value="😌 Calm">
    😌 Calm
    </option>

    <option value="😔 Sad">
    😔 Sad
    </option>

    <option value="😰 Anxious">
    😰 Anxious
    </option>

    <option value="😡 Frustrated">
    😡 Frustrated
    </option>

    <option value="😴 Tired">
    😴 Tired
    </option>

    <option value="🤔 Reflective">
    🤔 Reflective
    </option>

  </select>


</div>



<textarea
id="journalText"
placeholder="What's on your mind today?
```

You don't have to write perfectly.
Just write honestly.">

```
</textarea>



<div class="editor-footer">


  <div>

    <span id="wordCount">

      0 words

    </span>

    &nbsp; • &nbsp;

    <span id="saveStatus">

      Your thoughts stay saved on this device

    </span>

  </div>



  <button id="saveBtn">

    Save Entry

  </button>


</div>
```

  </div>

  <!-- SAVED ENTRIES -->

  <div
  class="saved-entries"
  id="savedEntries">

  </div>

</div>

<script>


/* =========================
   DATA
========================= */


let journals = [];


let currentJournal = null;


let editingEntry = null;



/* =========================
   LOCAL STORAGE
========================= */


function saveToStorage(){

  localStorage.setItem(

    "mindeaseJournals",

    JSON.stringify(journals)

  );


  localStorage.setItem(

    "mindeaseCurrentJournal",

    currentJournal

  );

}



function loadFromStorage(){


  const savedJournals =

  localStorage.getItem(
    "mindeaseJournals"
  );


  const savedCurrent =

  localStorage.getItem(
    "mindeaseCurrentJournal"
  );


  if(savedJournals){

    journals =
    JSON.parse(savedJournals);

  }


  if(
    savedCurrent !== null
  ){

    currentJournal =
    Number(savedCurrent);

  }

}



/* =========================
   RENDER JOURNALS
========================= */


function renderJournals(){


  const list =

  document.getElementById(
    "journalList"
  );


  list.innerHTML = "";


  if(
    journals.length === 0
  ){


    list.innerHTML = `

    <div class="empty-state">

      <div class="empty-icon">

        📔

      </div>

      Create your first journal
      to begin writing.

    </div>

    `;


    return;

  }



  journals.forEach(
  (journal,index) => {


    const card =

    document.createElement(
      "div"
    );


    card.className =
    "journal-card";


    card.style.background =
    journal.color;


    if(
      index === currentJournal
    ){

      card.classList.add(
        "active"
      );

    }



    const title =

    document.createElement(
      "div"
    );


    title.className =
    "journal-title";


    title.textContent =
    journal.title;



    const count =

    document.createElement(
      "div"
    );


    count.className =
    "journal-count";


    count.textContent =
    journal.entries.length
    +
    " entries";



    const deleteButton =

    document.createElement(
      "button"
    );


    deleteButton.className =
    "delete-journal";


    deleteButton.innerHTML =
    "×";


    deleteButton.onclick =
    function(event){


      event.stopPropagation();


      deleteJournal(index);

    };



    card.onclick =
    function(){


      currentJournal =
      index;


      clearEditor();


      renderJournals();


      displayEntries();


      saveToStorage();

    };



    card.appendChild(title);


    card.appendChild(count);


    card.appendChild(
      deleteButton
    );


    list.appendChild(card);


  });

}



/* =========================
   ADD JOURNAL
========================= */


document
.getElementById(
  "addJournalBtn"
)
.addEventListener(
"click",
function(){


  const name =

  document
  .getElementById(
    "newJournalName"
  )
  .value
  .trim();



  const color =

  document
  .getElementById(
    "journalColor"
  )
  .value;



  if(!name){

    alert(
      "Please give your journal a name."
    );


    return;

  }



  journals.push({

    title:name,

    color:color,

    entries:[]

  });



  currentJournal =

  journals.length - 1;



  document
  .getElementById(
    "newJournalName"
  )
  .value = "";



  renderJournals();


  displayEntries();


  saveToStorage();


});



/* =========================
   DELETE JOURNAL
========================= */


function deleteJournal(index){


  const confirmation =

  confirm(

    "Delete this journal and all of its entries?"

  );


  if(!confirmation)
  return;



  journals.splice(
    index,
    1
  );



  if(
    journals.length === 0
  ){

    currentJournal =
    null;

  }

  else{

    currentJournal =
    Math.min(
      index,
      journals.length - 1
    );

  }



  clearEditor();


  renderJournals();


  displayEntries();


  saveToStorage();


}



/* =========================
   DISPLAY ENTRIES
========================= */


function displayEntries(){


  const saved =

  document.getElementById(
    "savedEntries"
  );


  saved.innerHTML =
  "";


  const heading =

  document.createElement(
    "h2"
  );


  heading.textContent =
  "Your Entries";


  saved.appendChild(
    heading
  );



  if(
    currentJournal === null
  ){


    saved.innerHTML += `

    <div class="empty-state">

      <div class="empty-icon">

        ✍

      </div>

      Select or create a journal
      to start writing.

    </div>

    `;


    return;

  }



  const entries =

  journals[
    currentJournal
  ].entries;



  if(
    entries.length === 0
  ){


    saved.innerHTML += `

    <div class="empty-state">

      <div class="empty-icon">

        🌱

      </div>

      No entries yet.

      <br>

      Your thoughts can begin
      with just one sentence.

    </div>

    `;


    return;

  }



  [...entries]

  .reverse()

  .forEach(
  (entry,reverseIndex) => {


    const index =

    entries.length - 1
    -
    reverseIndex;



    const div =

    document.createElement(
      "div"
    );


    div.className =
    "entry";


    div.style.background =

    journals[
      currentJournal
    ].color
    +
    "33";



    const title =

    document.createElement(
      "div"
    );


    title.className =
    "entry-title";


    title.textContent =

    entry.title ||
    "Untitled Entry";



    const date =

    document.createElement(
      "div"
    );


    date.className =
    "entry-date";


    date.textContent =
    entry.date;



    const mood =

    document.createElement(
      "div"
    );


    mood.className =
    "entry-mood";


    mood.textContent =
    entry.mood;



    const content =

    document.createElement(
      "div"
    );


    content.className =
    "entry-content";


    content.textContent =
    entry.text;



    /* ACTIONS */


    const actions =

    document.createElement(
      "div"
    );


    actions.className =
    "entry-actions";



    const editButton =

    document.createElement(
      "button"
    );


    editButton.innerHTML =
    "✎";


    editButton.title =
    "Edit entry";


    editButton.onclick =
    function(){

      editEntry(
        index
      );

    };



    const deleteButton =

    document.createElement(
      "button"
    );


    deleteButton.innerHTML =
    "×";


    deleteButton.title =
    "Delete entry";


    deleteButton.onclick =
    function(){

      deleteEntry(
        index
      );

    };



    actions.appendChild(
      editButton
    );


    actions.appendChild(
      deleteButton
    );



    div.appendChild(
      title
    );


    div.appendChild(
      date
    );


    div.appendChild(
      mood
    );


    div.appendChild(
      content
    );


    div.appendChild(
      actions
    );


    saved.appendChild(
      div
    );


  });

}



/* =========================
   SAVE ENTRY
========================= */


document
.getElementById(
  "saveBtn"
)
.addEventListener(
"click",
saveEntry);



function saveEntry(){


  if(
    currentJournal === null
  ){


    alert(

      "Please create or select a journal first."

    );


    return;

  }



  const title =

  document
  .getElementById(
    "entryTitle"
  )
  .value
  .trim();



  const text =

  document
  .getElementById(
    "journalText"
  )
  .value
  .trim();



  const mood =

  document
  .getElementById(
    "moodSelector"
  )
  .value;



  if(!text){


    alert(

      "Write something before saving your entry."

    );


    return;

  }



  const now =

  new Date();



  /* EDIT MODE */


  if(
    editingEntry !== null
  ){


    journals[
      currentJournal
    ]
    .entries[
      editingEntry
    ]
    .title = title;



    journals[
      currentJournal
    ]
    .entries[
      editingEntry
    ]
    .text = text;



    journals[
      currentJournal
    ]
    .entries[
      editingEntry
    ]
    .mood = mood;



    journals[
      currentJournal
    ]
    .entries[
      editingEntry
    ]
    .date =

    "Updated: "
    +
    now.toLocaleString();



    editingEntry =
    null;


    document
    .getElementById(
      "saveBtn"
    )
    .textContent =
    "Save Entry";


  }


  /* NEW ENTRY */


  else{


    journals[
      currentJournal
    ]
    .entries
    .push({

      title:title,

      text:text,

      mood:mood,

      date:
      now.toLocaleString()

    });


  }



  saveToStorage();


  displayEntries();


  renderJournals();


  clearEditor();


  document
  .getElementById(
    "saveStatus"
  )
  .textContent =

  "✓ Entry saved successfully";


}



/* =========================
   EDIT ENTRY
========================= */


function editEntry(index){


  const entry =

  journals[
    currentJournal
  ]
  .entries[
    index
  ];



  document
  .getElementById(
    "entryTitle"
  )
  .value =
  entry.title;



  document
  .getElementById(
    "journalText"
  )
  .value =
  entry.text;



  document
  .getElementById(
    "moodSelector"
  )
  .value =
  entry.mood;



  editingEntry =
  index;



  document
  .getElementById(
    "saveBtn"
  )
  .textContent =
  "Update Entry";



  document
  .getElementById(
    "journalText"
  )
  .focus();



  document
  .getElementById(
    "journalText"
  )
  .scrollIntoView({

    behavior:"smooth"

  });


}



/* =========================
   DELETE ENTRY
========================= */


function deleteEntry(index){


  const confirmation =

  confirm(

    "Are you sure you want to delete this entry?"

  );


  if(!confirmation)
  return;



  journals[
    currentJournal
  ]
  .entries
  .splice(
    index,
    1
  );



  saveToStorage();


  displayEntries();


  renderJournals();


}



/* =========================
   CLEAR EDITOR
========================= */


function clearEditor(){


  document
  .getElementById(
    "entryTitle"
  )
  .value = "";



  document
  .getElementById(
    "journalText"
  )
  .value = "";



  editingEntry =
  null;



  document
  .getElementById(
    "saveBtn"
  )
  .textContent =
  "Save Entry";


}



/* =========================
   WORD COUNT
========================= */


document
.getElementById(
  "journalText"
)
.addEventListener(
"input",
function(){


  const text =

  this.value
  .trim();



  const words =

  text ?

  text.split(
    /\s+/
  ).length

  :

  0;



  document
  .getElementById(
    "wordCount"
  )
  .textContent =

  words
  +
  " words";


});



/* =========================
   ENTER TO CREATE JOURNAL
========================= */


document
.getElementById(
  "newJournalName"
)
.addEventListener(
"keydown",
function(event){


  if(
    event.key === "Enter"
  ){


    document
    .getElementById(
      "addJournalBtn"
    )
    .click();


  }

});



/* =========================
   INITIAL LOAD
========================= */


loadFromStorage();


renderJournals();


displayEntries();


</script>

</body>

</html>
